<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MAQUAS">
<link rel="manifest" href="/takip.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/simge-180.png">
<link rel="icon" href="/simge-192.png">
<title>MAQUAS</title>
<script>
/* görünüm: açık / koyu / sistem (bu cihazda saklanır) */
(function(){
  function uygula(){
    var s="sistem"; try{ s=localStorage.getItem("maquas-tema")||"sistem"; }catch(e){}
    var koyu = s==="koyu" || (s==="sistem" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-tema", koyu?"koyu":"acik");
    var m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content", koyu?"#000000":"#ffffff");
  }
  window.temaUygula=uygula; uygula();
  try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){ uygula(); }); }catch(e){}
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.js"></script>
<style>
:root{--siyah:#111;--kirmizi:#d71920;--sari:#f0c419;--yesil:#059669;
  --gri1:#f5f5f4;--gri2:#e7e5e4;--gri3:#a8a29e;--gri4:#57534e;
  --yuzey:#fff;--yuzey2:#fafaf9;--ters:#fff;--siyah-h:#000;color-scheme:light}
/* koyu görünüm */
html[data-tema="koyu"]{--siyah:#f5f5f4;--kirmizi:#e5383b;--yesil:#10b981;
  --gri1:#121110;--gri2:#33312e;--gri3:#8f8a85;--gri4:#c2bdb8;
  --yuzey:#1c1b19;--yuzey2:#242220;--ters:#111;--siyah-h:#fff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--gri1);color:var(--siyah);font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.gizli{display:none!important}
label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
input,select,textarea{width:100%;border:1px solid var(--gri2);padding:10px 12px;background:var(--yuzey);border-radius:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--siyah);outline-offset:-2px}
input:disabled,select:disabled,textarea:disabled{background:var(--gri1);color:var(--gri4)}
.btn{display:inline-block;background:var(--siyah);color:var(--ters);padding:12px 18px;font-weight:600;text-align:center}
.btn:hover{background:var(--siyah-h)}
.btn-tam{width:100%}
.btn-acik{background:var(--yuzey);color:var(--siyah);border:1px solid var(--siyah)}
.btn-acik:hover{background:var(--gri1)}
.btn-yesil{background:var(--yesil);color:#fff}
.btn-kirmizi{background:var(--yuzey);color:var(--kirmizi);border:1px solid var(--kirmizi)}
.btn-kirmizi:hover{background:#fef2f2}
.btn-kucuk{padding:7px 12px;font-size:13px}
.hata{color:var(--kirmizi);font-size:13px;margin:8px 0}
.ipucu{font-size:12px;color:var(--gri3);margin-top:4px}
.bos{background:var(--yuzey);padding:36px 18px;text-align:center;color:var(--gri4)}

/* giris */









/* ============ giriş ekranı ============ */
.giris{min-height:100vh;display:grid;grid-template-columns:1fr;background:var(--gri1)}
@media(min-width:900px){.giris{grid-template-columns:1.05fr 1fr}}
.giris-sol{display:none;position:relative;background:#111;color:#fff;padding:56px 56px 48px;
  flex-direction:column;justify-content:center;overflow:hidden}
@media(min-width:900px){.giris-sol{display:flex}}
.giris-sol:before{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 90% at 15% 0%,#2a2a2a 0%,#111 55%,#0a0a0a 100%)}
.giris-sol>*{position:relative}
.giris-marka svg{width:300px;height:auto;display:block;margin-bottom:38px}
.giris-sol h1{margin:0 0 14px;font-size:38px;line-height:1.18;font-weight:800;letter-spacing:-.02em}
.giris-sol p{margin:0;color:#a8a29e;font-size:16px;max-width:36ch;line-height:1.6}
.giris-seritler{display:flex;gap:0;margin-top:44px;width:230px;height:5px}
.giris-seritler i{flex:1}
.giris-seritler i:nth-child(1){background:#fff}
.giris-seritler i:nth-child(2){background:var(--kirmizi)}
.giris-seritler i:nth-child(3){background:var(--sari)}
.giris-sag{display:flex;align-items:center;justify-content:center;padding:28px 20px}
.giris-kutu{width:100%;max-width:380px;background:var(--yuzey);padding:36px 32px 28px;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 34px rgba(0,0,0,.07);border-top:4px solid var(--siyah)}
.giris-logo{margin-bottom:22px;display:flex;justify-content:center}
.giris-logo svg{width:200px;height:auto;display:block}
@media(min-width:900px){.giris-logo{display:none}}
.giris-kutu h2{margin:0 0 4px;font-size:23px;font-weight:800;letter-spacing:-.01em}
.giris-alt{margin:0 0 26px;color:var(--gri3);font-size:14px}
@media(max-width:899px){
  .giris-sag{padding:20px 16px}
  .giris-kutu{padding:30px 24px 24px}
  .giris-kutu h2{text-align:center;font-size:21px}
  .giris-alt{text-align:center;margin-bottom:24px}
  .giris-logo{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--gri2)}
}
.giris-kutu label{font-size:13px;font-weight:600;color:var(--gri4);margin-bottom:6px}
.giris-kutu input{padding:13px 14px;border:1px solid var(--gri2);transition:border-color .15s,box-shadow .15s}
.giris-kutu input::placeholder{color:#c4bfba}
.giris-kutu input:focus{outline:none;border-color:var(--siyah);box-shadow:0 0 0 3px rgba(17,17,17,.08)}
.sifre-kutu{position:relative}
.sifre-kutu input{padding-right:70px}
.goz{position:absolute;right:4px;top:50%;transform:translateY(-50%);padding:8px 10px;font-size:13px;
  font-weight:600;color:var(--gri4)}
.goz:hover{color:var(--siyah)}
.giris-btn{margin-top:20px;padding:14px;font-size:16px;letter-spacing:.01em}
.giris-roller{display:flex;gap:8px;margin-top:22px;padding-top:18px;border-top:1px solid var(--gri2)}
.giris-roller span{flex:1;text-align:center;font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--gri3);padding:6px 2px;background:var(--gri1)}
.giris-dip{margin:14px 0 0;font-size:12px;color:var(--gri3);text-align:center;line-height:1.5}
.giris .hata{min-height:20px;margin:10px 0 0}

/* üst şeritteki logo */
.ust-logo{display:block;flex:none;padding:2px 0}
.ust-logo svg{width:124px;height:auto;display:block}
@media(max-width:700px){.ust-logo svg{width:108px}}
.ust-ad{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}

/* ust */
.ust{background:var(--yuzey);color:var(--siyah);border-bottom:1px solid var(--gri2);padding-top:env(safe-area-inset-top)}
.sarma{max-width:1120px;margin:0 auto;padding:0 16px}
.ust-ic{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:10px}
.ust-sag{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--gri4)}
.zil{position:relative;width:38px;height:38px;color:var(--siyah);display:flex;align-items:center;justify-content:center}
.zil svg{display:block}
.zil-sayi{position:absolute;top:2px;right:0;background:var(--kirmizi);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.uyari{padding:9px 0;font-size:14px}.uyari-kirmizi{background:var(--kirmizi);color:#fff}.uyari-sari{background:var(--sari);color:#111}
.sekmeler{background:var(--yuzey);border-bottom:1px solid var(--gri2);position:sticky;top:0;z-index:20}
.sekmeler .sarma{display:flex;overflow-x:auto}
.sekme{padding:13px 16px;font-size:14px;font-weight:600;color:var(--gri4);border-bottom:2px solid transparent;white-space:nowrap}
.sekme.aktif{color:var(--siyah);border-bottom-color:var(--kirmizi)}
main{max-width:1120px;margin:0 auto;padding:22px 16px 90px}
.kart{background:var(--yuzey)}
.baslik-satir{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.baslik-satir h2{margin:0;font-size:20px}

/* takvim */
.takvim-duzen{display:grid;gap:20px}
@media(min-width:1000px){.takvim-duzen{grid-template-columns:1fr 360px}}
.takvim-ust{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--gri2)}
.takvim-ust h2{margin:0;font-size:18px}
.ok{width:40px;height:40px;font-size:22px}.ok:hover{background:var(--gri1)}
.gun-bas,.gun-izgara{display:grid;grid-template-columns:repeat(7,1fr)}
.gun-bas{border-bottom:1px solid var(--gri2)}
.gun-bas div{padding:8px 0;text-align:center;font-size:12px;font-weight:600;color:var(--gri3)}
.hucre{position:relative;aspect-ratio:1;border-bottom:1px solid var(--gri1);border-right:1px solid var(--gri1);padding:5px;display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:3px}
.hucre:hover{background:var(--gri1)}
.hucre.secili{outline:2px solid var(--siyah);outline-offset:-2px;background:var(--yuzey)}
.hucre.bos-h{cursor:default}
.hucre-no{font-size:13px;font-weight:600;align-self:flex-start}
.hucre.bugun .hucre-no{background:var(--siyah);color:var(--ters);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.hucre.bayram .hucre-no{color:var(--kirmizi)}
.hucre.bugun.bayram .hucre-no{color:#fff;background:var(--kirmizi)}
.isaret{font-size:11px;font-weight:700;padding:2px 5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.isaret.gecikmis{background:var(--kirmizi);color:#fff}
.isaret.yakin{background:var(--sari)}
.isaret.normal{background:var(--gri2);color:var(--gri4)}
.isaret.kapali{background:#d1fae5;color:#065f46}
.isaret.iptal{background:var(--yuzey);color:var(--gri3);text-decoration:line-through;border:1px solid var(--gri2)}
.isaret.siparis{background:var(--yuzey);color:var(--gri4);border:1px dashed var(--gri3);font-weight:600}
.noktalar{display:flex;flex-direction:column;gap:3px}
.fazla{font-size:10px;color:var(--gri3);line-height:1}
.aciklama{padding:12px 14px;border-top:1px solid var(--gri2);display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--gri4)}
.aciklama span{display:flex;align-items:center;gap:6px}
.ornek{display:inline-block;width:16px;height:12px}
.grup-etiket{font-size:12px;font-weight:700;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.grup-etiket.gri{color:var(--gri3)}
.yan-baslik{font-weight:700;margin:0 0 2px}
.yan-ozet{font-size:14px;color:var(--gri3);margin:0 0 12px}
.bayram-not{background:#fef2f2;border-left:4px solid var(--kirmizi);padding:10px 12px;font-size:14px;margin-bottom:12px}

/* is satiri */
.is-satir{display:block;width:100%;text-align:left;background:var(--yuzey);border:1px solid var(--gri2);border-left:4px solid var(--gri2);padding:12px;margin-bottom:8px}
.is-satir:hover{background:var(--gri1)}
.is-satir.gecikmis{border-left-color:var(--kirmizi)}
.is-satir.yakin{border-left-color:var(--sari)}
.is-satir.kapali{border-left-color:var(--yesil)}
.is-satir.iptal{opacity:.6}
.is-ust{display:flex;justify-content:space-between;gap:12px}
.is-kod{font-weight:700}
.is-alt{font-size:14px;color:var(--gri4)}
.is-sag{text-align:right;white-space:nowrap}
.is-adet{font-size:12px;color:var(--gri3)}
.is-gun{font-weight:700;font-size:14px}
.is-gun.kirmizi{color:var(--kirmizi)}.is-gun.sari{color:#a16207}.is-gun.yesil{color:var(--yesil)}.is-gun.gri{color:var(--gri3)}
.zaman{margin-top:8px;font-size:13px;color:var(--gri4);display:flex;flex-wrap:wrap;gap:3px 12px}
.zaman b{color:var(--siyah)}
.durum-yazi{margin-top:4px;font-size:13px;font-weight:600}
.durum-yazi.yesil{color:var(--yesil)}.durum-yazi.kirmizi{color:var(--kirmizi)}.durum-yazi.mavi{color:#0369a1}
.fiyat-yazi{margin-top:6px;font-size:12px;color:var(--gri3)}

/* liste */
.arac{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.arac input{flex:1;min-width:200px}
.filtreler{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px}
.filtre{padding:6px 12px;font-size:14px;font-weight:600;border:1px solid var(--gri2);background:var(--yuzey);color:var(--gri4);white-space:nowrap}
.filtre.aktif{background:var(--siyah);color:var(--ters);border-color:var(--siyah)}

/* modal */
.perde{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;overflow-y:auto}
@media(min-width:700px){.perde{align-items:center;padding:16px}}
.modal{background:var(--yuzey);width:100%;max-width:680px;max-height:94vh;overflow-y:auto;display:flex;flex-direction:column}
.modal-ust{position:sticky;top:0;background:var(--yuzey);border-bottom:1px solid var(--gri2);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.modal-ust h3{margin:0;font-size:17px}
.kapat{width:36px;height:36px;font-size:24px}
.modal-ic{padding:16px;display:flex;flex-direction:column;gap:16px}
.ikili{display:grid;gap:14px}
@media(min-width:640px){.ikili{grid-template-columns:1fr 1fr}}
.bolum{border:1px solid var(--gri2);padding:14px}
.bolum-baslik{font-size:14px;font-weight:700;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bolum.finans{background:var(--gri1)}
.ek-satir{display:grid;grid-template-columns:1.1fr 1.1fr .8fr;gap:6px;margin-bottom:8px}
.ek-satir input{min-width:0;padding-left:8px;padding-right:8px}
.ek-baslik{margin-bottom:4px;font-size:12px;font-weight:600;color:var(--gri4)}
.ek-adet{margin-bottom:10px}
.ek-adet select{max-width:140px}
.hedef-blok{border-left:4px solid var(--siyah);background:var(--gri1);padding:12px 16px}
.hedef-tarih{font-size:20px;font-weight:800}
.hedef-alt{font-size:13px;color:var(--gri4)}
.hesap{font-size:14px;line-height:1.8}
.hesap .kar{font-weight:800}
.hesap .kar.eksi{color:var(--kirmizi)}
.durum-banner{padding:12px 16px;font-weight:700}
.durum-banner.kapali{background:#d1fae5;color:#065f46}
.durum-banner.iptal{background:#fee2e2;color:#991b1b}
.teslimat-satir{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--gri1);font-size:14px}
.teslimat-satir:last-child{border-bottom:0}
.gecmis-satir{font-size:13px;color:var(--gri4);padding:5px 0;border-bottom:1px solid var(--gri1)}
.gecmis-satir b{color:var(--siyah)}
.modal-alt{position:sticky;bottom:0;background:var(--yuzey);border-top:1px solid var(--gri2);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.son-butonlar{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:4px}
.foto-alan{border:2px dashed var(--gri2);width:100%;padding:22px;color:var(--gri3)}
.foto-on{position:relative}
.foto-on img{width:100%;max-height:220px;object-fit:contain;background:var(--gri1);display:block}
.foto-kaldir{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.92);padding:5px 12px;font-size:13px;font-weight:600}
.belge-satir{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--gri1)}
.belge-satir a{color:var(--siyah);text-decoration:none;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.belge-boyut{font-size:12px;color:var(--gri3)}
.sil-link{color:var(--kirmizi);font-weight:600;font-size:13px;flex:none}

/* diyalog */
.diyalog-perde{z-index:60}
.diyalog{background:var(--yuzey);width:100%;max-width:440px}

/* rapor */
.rapor-ust{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.rapor-ust select{width:auto}
.kutular{display:grid;gap:1px;background:var(--gri2);margin-bottom:18px;grid-template-columns:1fr 1fr}
@media(min-width:900px){.kutular.dort{grid-template-columns:repeat(4,1fr)}}
.kutu{background:var(--yuzey);padding:14px 16px}
.kutu-e{font-size:13px;color:var(--gri3);margin-bottom:2px}
.kutu-d{font-size:22px;font-weight:800}
.kutu-d.eksi{color:var(--kirmizi)}
.kutu-alt{font-size:12px;margin-top:2px}
.kutu-alt.art{color:var(--yesil)}.kutu-alt.azl{color:var(--kirmizi)}
.grafikler{display:grid;gap:18px;margin-bottom:18px}
@media(min-width:900px){.grafikler{grid-template-columns:1fr 1.3fr}}
.grafik-kart{background:var(--yuzey);padding:16px}
.grafik-kart h3{margin:0 0 4px;font-size:15px}
.grafik-kart p{margin:0 0 12px;font-size:13px;color:var(--gri3)}
.pasta-duzen{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pasta-duzen svg{flex:none}
.efsane{flex:1;min-width:160px;font-size:13px}
.efsane div{display:flex;align-items:center;gap:8px;padding:3px 0}
.efsane i{width:12px;height:12px;flex:none}
.efsane span{flex:1}
.cizgi-efsane{display:flex;gap:16px;font-size:12px;color:var(--gri4);margin-top:6px}
.cizgi-efsane span{display:flex;align-items:center;gap:6px}
.tablo-kart{background:var(--yuzey);margin-bottom:18px;overflow-x:auto}
.tablo-baslik{padding:12px 16px;border-bottom:1px solid var(--gri2);font-weight:700;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--gri1);white-space:nowrap}
th{font-size:12px;color:var(--gri3);font-weight:600;background:var(--yuzey2)}
td.sag,th.sag{text-align:right}
tfoot td{font-weight:800;border-top:2px solid var(--gri2)}

/* musteri */
.musteri-satir{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--yuzey);border:1px solid var(--gri2);padding:14px;margin-bottom:8px}
.musteri-satir:hover{background:var(--gri1)}
.bakiye{font-weight:800;text-align:right}
.bakiye.borc{color:var(--kirmizi)}
.bakiye small{display:block;font-weight:400;font-size:12px;color:var(--gri3)}
.geri{font-size:14px;font-weight:600;color:var(--gri4);margin-bottom:12px;display:inline-block}
.cari-ozet{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--gri2);margin-bottom:16px}
.parca-karti{display:flex;gap:12px;align-items:center;background:var(--yuzey);border:1px solid var(--gri2);padding:10px;margin-bottom:8px}
.parca-karti img{width:56px;height:56px;object-fit:cover;background:var(--gri1);flex:none}
.parca-karti .pk-bilgi{flex:1;min-width:0}
.parca-karti .pk-bilgi div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ayarlar */
.ayar-duzen{display:grid;gap:18px}
.sayfa-not{margin:-6px 0 14px;color:var(--gri4);font-size:14px}
.ok-sag{font-size:22px;color:var(--gri3)}
.stok-satir{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--yuzey);border:1px solid var(--gri2);padding:12px 14px;margin-bottom:8px}
.stok-miktar{font-size:20px;font-weight:800;text-align:right;white-space:nowrap}
.stok-miktar small{display:block;font-size:12px;font-weight:600;color:var(--gri4)}
.kutular.uclu{grid-template-columns:1fr 1fr;margin-top:-4px}
.kutular.uclu .net{grid-column:1/-1}
@media(min-width:900px){.kutular.uclu{grid-template-columns:repeat(3,1fr)}.kutular.uclu .net{grid-column:auto}}
.ek-duzen{display:grid;gap:16px;margin-bottom:16px}
@media(min-width:900px){.ek-duzen{grid-template-columns:1fr 1fr}}
.ek-kart{margin-bottom:0}
.ek-ozet{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 16px;font-size:13px;color:var(--gri4);border-bottom:1px solid var(--gri1);background:var(--yuzey2)}
.ek-kart .art{color:var(--yesil)} .ek-kart .azl{color:var(--kirmizi)}
.ayar-tam{grid-column:1/-1}
.depo-cubuk{height:8px;background:var(--gri2);overflow:hidden}
.depo-cubuk i{display:block;height:100%}
@media(min-width:900px){.ayar-duzen{grid-template-columns:1fr 1fr}}
.satir{padding:12px 16px;border-bottom:1px solid var(--gri1);display:flex;justify-content:space-between;align-items:center;gap:10px}
.satir:last-child{border-bottom:0}
.form-dikey{display:flex;flex-direction:column;gap:12px;padding:16px}
.kutucuk{display:flex;align-items:center;gap:10px;font-size:14px}
.kutucuk input{width:20px;height:20px;flex:none}

/* bildirim paneli */
.bildirim{padding:12px 16px;border-bottom:1px solid var(--gri1);font-size:14px}
.bildirim.yeni{background:#fffbeb}
.bildirim small{display:block;color:var(--gri3);font-size:12px}


/* ============ takvim — iPhone düzeni ============ */
.it{background:var(--yuzey);padding:18px 18px 10px;user-select:none;-webkit-user-select:none}
.it-ust{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.it-baslik{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.it-yil{color:var(--kirmizi);font-weight:700}
.it-dugmeler{display:flex;align-items:center;gap:4px}
.it-bugun{color:var(--kirmizi);font-weight:600;font-size:15px;padding:6px 10px}
.it-ok{width:40px;height:40px;font-size:28px;line-height:1;color:var(--kirmizi);border-radius:50%}
.it-ok:hover,.it-bugun:hover{background:var(--gri1)}
.it-gunler{display:grid;grid-template-columns:repeat(7,1fr);padding-bottom:8px}
.it-gunler span{text-align:center;font-size:12px;font-weight:600;color:var(--gri3);text-transform:uppercase;letter-spacing:.04em}
.it-gunler span.hafta-sonu{color:#c4bfba}
.it-izgara{border-top:1px solid var(--gri2)}
.it-hafta{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--gri2)}
.it-hucre{min-height:112px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0}
.it-hucre:not(.it-bos):hover .it-no{background:var(--gri1)}
.it-no{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:500;transition:background .15s}
.it-hucre.hafta-sonu .it-no{color:var(--gri3)}
.it-hucre.bayram .it-no{color:var(--kirmizi);font-weight:700}
.it-hucre.secili .it-no{background:var(--siyah)!important;color:var(--ters)!important;font-weight:700}
.it-hucre.bugun .it-no{color:var(--kirmizi);font-weight:800}
.it-hucre.bugun.secili .it-no{background:var(--kirmizi)!important;color:#fff!important}
.it-noktalar{display:none;gap:4px;justify-content:center}
.it-d{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gri3)}
.it-d.gecikmis{background:var(--kirmizi)}
.it-d.yakin{background:#eab308}
.it-d.normal{background:#78716c}
.it-d.kapali{background:var(--yesil)}
.it-d.iptal{background:transparent;border:1.5px solid var(--gri3)}
.it-d.siparis{background:transparent;border:1.5px solid #78716c}
.it-etiketler{display:flex;flex-direction:column;gap:3px;width:100%;overflow:hidden}
.it-e{display:block;font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;text-align:left;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it-e.gecikmis{background:#fee2e2;color:#991b1b}
.it-e.yakin{background:#fef3c7;color:#854d0e}
.it-e.normal{background:#f5f5f4;color:#44403c}
.it-e.kapali{background:#d1fae5;color:#065f46}
.it-e.iptal{color:var(--gri3);text-decoration:line-through}
.it-e.siparis{background:transparent;color:#78716c;border:1px dashed #d6d3d1}
.it-etiketler .it-e:nth-child(n+4){display:none}
.it-aciklama{display:flex;flex-wrap:wrap;gap:6px 16px;padding:12px 2px 4px;font-size:12px;color:var(--gri4)}
.it-aciklama span{display:flex;align-items:center;gap:6px}

.it-gun{background:var(--yuzey);margin-top:14px;padding:16px 18px 18px}
.it-gun-ust{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.it-gun-baslik{font-size:22px;font-weight:800;line-height:1.1}
.it-gun-alt{font-size:14px;color:var(--gri3)}
.it-ekle{width:44px;height:44px;border-radius:50%;background:var(--kirmizi);color:#fff;font-size:28px;line-height:1;flex:none}
.it-ekle:hover{background:#b91c1c}
.it-bos-gun{padding:26px 0;text-align:center;color:var(--gri3)}
.it-gun .grup-etiket:first-child{margin-top:0}

@media(max-width:700px){
  /* telefonda kenardan kenara */
  .it{margin:-14px -12px 0;padding:14px 8px 8px}
  .it-ust{padding:0 8px}
  .it-baslik{font-size:28px}
  .it-hucre{min-height:58px;padding:6px 0 4px;gap:4px}
  .it-no{width:36px;height:36px;font-size:18px}
  .it-noktalar{display:flex}
  .it-etiketler{display:none}
  .it-aciklama{padding:10px 8px 2px;font-size:11px;gap:4px 12px}
  .it-gun{margin:10px -12px 0;padding:16px 14px}
}

.tur-sec{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tur-btn{padding:11px;font-weight:600;border:1px solid var(--gri2);background:var(--yuzey);color:var(--gri4)}
.tur-btn.aktif{background:var(--siyah);color:var(--ters);border-color:var(--siyah)}
.cari-bilgi{background:var(--yuzey);border:1px solid var(--gri2);margin:-4px 0 16px}
.cb-satir{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:9px 14px;border-bottom:1px solid var(--gri1);font-size:14px}
.cb-satir:last-child{border-bottom:0}
.cb-satir span{color:var(--gri4)}
.cb-satir b{font-weight:600;word-break:break-word}
.cb-satir a{color:inherit}
@media(max-width:700px){.cb-satir{grid-template-columns:1fr;gap:0}}
.tur-rozet{display:inline-block;vertical-align:middle;font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 8px;background:var(--gri2);color:var(--gri4);margin-left:8px}
.tur-rozet.ted{background:#e0f2fe;color:#075985}
.is-foto{margin-top:8px;width:100%;max-width:170px;height:92px;object-fit:cover;background:var(--gri1);display:block}
.mb-foto{width:100%;max-height:230px;object-fit:contain;background:var(--gri1);display:block}
.mb-liste{border:1px solid var(--gri2)}
.mb-satir{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-bottom:1px solid var(--gri1);font-size:15px}
.mb-satir:last-child{border-bottom:0}
.mb-satir span{color:var(--gri4)}

/* makinalar */
.makina-satir{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--yuzey);border:1px solid var(--gri2);padding:12px 14px;margin-bottom:8px}
.mk-simge{width:42px;height:42px;flex:none;background:var(--siyah);color:var(--sari);display:flex;align-items:center;justify-content:center;font-size:20px}
.mk-sekme{margin-bottom:14px}
.mk-aralik{font-size:14px;margin-top:8px}
.mk-bilgi{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--gri2);margin-top:8px;border:1px solid var(--gri2)}
.mk-bilgi span{background:var(--yuzey2);padding:6px 8px;font-size:11px;color:var(--gri4);display:flex;flex-direction:column}
.mk-bilgi b{font-size:14px;color:var(--siyah)}
.mk-alt{display:flex;gap:10px;margin-top:8px;font-size:13px;color:var(--gri4);align-items:flex-start}
.mk-alt img{width:72px;height:56px;object-fit:cover;flex:none;background:var(--gri1)}
.mk-rozet{color:var(--gri4)}
.bakim-satir{display:block;width:100%;text-align:left;background:var(--yuzey);border:1px solid var(--gri2);border-left:4px solid var(--yesil);padding:12px;margin-bottom:8px}
.bakim-satir.ariza{border-left-color:var(--kirmizi)}
.bk-ust{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px}
.bk-tur{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--yesil)}
.bakim-satir.ariza .bk-tur{color:var(--kirmizi)}
.bk-tarih{font-size:13px;font-weight:600}
.bk-not{font-size:14px}
.bk-kisi{font-size:12px;color:var(--gri3);margin-top:6px}
.bk-fotolar{display:flex;gap:6px;margin-top:8px}
.bk-fotolar img{width:64px;height:64px;object-fit:cover;background:var(--gri1)}
.bk-ekle{display:flex;flex-wrap:wrap;gap:8px}
.bk-foto{position:relative;width:84px;height:84px}
.bk-foto img{width:100%;height:100%;object-fit:cover;display:block}
.bk-foto button{position:absolute;top:2px;right:2px;width:26px;height:26px;background:rgba(0,0,0,.65);color:#fff;font-size:18px;line-height:1}
.bk-foto-ekle{width:84px;height:84px;border:2px dashed var(--gri2);color:var(--gri3);font-size:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.bk-foto-ekle span{font-size:11px;margin-top:4px}
.tur-btn.ariza.aktif{background:var(--kirmizi);border-color:var(--kirmizi)}

/* sunucu: eşitleme rozeti, giriş bağlantıları, kullanıcı yönetimi */
.senk{font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;white-space:nowrap}
.senk-gri{background:#3f3f46;color:#e7e5e4}.senk-sari{background:var(--sari);color:#111}.senk-kirmizi{background:var(--kirmizi);color:#fff}
.giris-baglantilar{display:flex;justify-content:space-between;margin-top:16px;font-size:14px}
.giris-baglantilar a,.giris-dip a{color:var(--siyah)}
.giris-durum{text-align:center;padding:30px 0;color:var(--gri4)}
.donen{width:34px;height:34px;border:3px solid var(--gri2);border-top-color:var(--kirmizi);border-radius:50%;margin:0 auto 12px;animation:don 0.8s linear infinite}
@keyframes don{to{transform:rotate(360deg)}}
.kisi-satir{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--gri1);background:var(--yuzey)}
.kisi-satir.bekliyor{background:#fff7ed}
.kisi-detay{display:flex;flex-direction:column;gap:12px;padding:14px 16px 18px;background:var(--yuzey2);border-bottom:1px solid var(--gri2)}
.yetki-liste{flex-direction:column;gap:8px}
.rol-rozet{flex:none;font-size:11px;font-weight:700;padding:3px 8px;background:var(--gri2);color:var(--gri4);white-space:nowrap;max-width:48%;overflow:hidden;text-overflow:ellipsis}
.rol-rozet.r-admin{background:var(--siyah);color:var(--ters)}.rol-rozet.r-personel{background:#e0f2fe;color:#075985}.rol-rozet.r-musteri{background:#ecfccb;color:#3f6212}.rol-rozet.r-yok{background:#fed7aa;color:#9a3412}
.rozet-kirmizi{display:inline-block;margin-left:8px;background:var(--kirmizi);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;vertical-align:middle}

/* revize 3 */
.salt-oku{border:1px solid var(--gri2);background:var(--gri1);padding:10px 12px;font-weight:700;min-height:44px}
.salt-oku span{font-weight:400;color:var(--gri4)}
.fiyat-kdv{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:end}
.duz-link{color:var(--siyah);font-weight:600;font-size:13px;text-decoration:underline}

/* alt cubuk (telefon) */
.alt-cubuk{display:none}
@media(max-width:700px){
  body{font-size:16px}
  main{padding:14px 12px 100px}
  .sekmeler{display:none}
  .alt-cubuk{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--yuzey);border-top:1px solid var(--gri2);padding-bottom:env(safe-area-inset-bottom)}
  .alt-sekme{flex:1;padding:9px 2px 7px;text-align:center;font-size:11px;font-weight:600;color:var(--gri3);display:flex;flex-direction:column;align-items:center;gap:2px}
  .alt-sekme.aktif{color:var(--siyah)}
  .alt-sekme .im{font-size:19px;line-height:1}
  .alt-sekme.aktif .im{color:var(--kirmizi)}
  .alt-cubuk.sik .alt-sekme{font-size:10px;letter-spacing:-.01em;padding-left:0;padding-right:0}
  .alt-cubuk.sik .alt-sekme .im{font-size:18px}
  .hucre{aspect-ratio:auto;min-height:56px;padding:4px 2px;align-items:center}
  .hucre-no{align-self:center;font-size:14px}
  .noktalar{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:4px}
  .isaret{font-size:0;width:11px;height:11px;border-radius:50%;padding:0}
  .isaret.siparis{border:1.5px dashed var(--gri3)}
  .isaret.iptal{border:1.5px solid var(--gri3)}
  .perde{align-items:stretch}
  .modal{max-width:none;max-height:none;min-height:100vh}
  input,select,textarea{padding:12px;font-size:16px}
  .btn{padding:14px 18px}
  .zaman{flex-direction:column;gap:1px}
  .cari-ozet{grid-template-columns:1fr}
}

/* görünüm seçici */
/* revize 5 */
.grup-baslik{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--siyah);font-weight:700;font-size:15px}
.grup-baslik small{font-weight:600;color:var(--gri3);font-size:12px;margin-left:4px}
.mk-plan{border:1px solid var(--gri2);background:var(--yuzey2);padding:12px;margin-bottom:10px}
.mk-plan-ust{display:flex;justify-content:space-between;align-items:center}
.mk-plan-ust label{margin:0 0 4px}
.mk-uretim{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--gri4);margin-top:8px}
.ilerleme{height:6px;background:var(--gri2);margin:2px 0 10px;overflow:hidden}
.ilerleme i{display:block;height:100%;background:var(--yesil)}
.mk-foto{width:42px;height:42px;flex:none;object-fit:cover;background:var(--gri1)}
.mk-buyuk{display:block;width:100%;max-height:240px;object-fit:cover;margin:0 0 14px;cursor:zoom-in;background:var(--gri1)}
.mk-foto-yok{display:flex;align-items:center;gap:10px;width:100%;padding:16px;margin:0 0 14px;border:1px dashed var(--gri3);color:var(--gri4);font-weight:600;background:var(--yuzey)}
.mk-foto-yok span{font-size:20px}
.foto-on img,.bk-fotolar img,.bk-foto img,.mk-alt img,.mb-foto,.parca-karti img[src]{cursor:zoom-in}
.bk-daha{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gri4);background:var(--gri1);min-width:44px;cursor:zoom-in}
.isik{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 48px) 12px calc(env(safe-area-inset-bottom) + 48px)}
.isik img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.isik-kapat{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:10px;width:44px;height:44px;color:#fff;font-size:32px;line-height:1}
.isik-ok{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;color:#fff;font-size:40px;line-height:1;background:rgba(255,255,255,.08)}
.isik-ok.sol{left:6px}.isik-ok.sag{right:6px}
.isik-sayi{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 14px);left:0;right:0;text-align:center;color:#d6d3d1;font-size:13px}
/* ayarlar sayfası */
.ayar-sayfa{max-width:640px;margin:0 auto;display:flex;flex-direction:column}
.ayar-grup-baslik{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gri3);padding:20px 4px 7px;display:flex;align-items:center}
.ayar-grup{background:var(--yuzey);border:1px solid var(--gri2)}
.ayar-satir{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 16px;border-top:1px solid var(--gri2);width:100%;text-align:left;min-height:56px}
.ayar-grup>.ayar-satir:first-child{border-top:0}
.ayar-cok{display:block}
.ayar-ust{display:flex;align-items:center;justify-content:space-between;gap:14px}
.ayar-ad{font-weight:600;font-size:15px}
.ayar-acik{font-size:12.5px;color:var(--gri3);margin-top:1px;line-height:1.4}
.ayar-not{font-size:12.5px;color:var(--gri4);margin-top:8px;line-height:1.45}
.ayar-not a{color:var(--siyah);font-weight:600}

/* eski sürüm kayıtlarını yeni yapıya taşır */
function goc(){
  var v=veri;
  v.musteriler=v.musteriler||[]; v.parcaKartlari=v.parcaKartlari||[];
  v.tahsilatlar=v.tahsilatlar||[]; v.gosterilenBildirim=v.gosterilenBildirim||{};
  v.ekKalemler=v.ekKalemler||[]; v.stoklar=v.stoklar||[]; v.makinalar=v.makinalar||[]; v.bakimlar=v.bakimlar||[]; v.uretimler=v.uretimler||[];
  v.musteriler.forEach(function(m){
    if(!m.tur) m.tur='musteri';
    /* eski "Vergi dairesi / no" tek alanını ikiye ayır */
    if(m.vergiDairesi===undefined){
      var vn=String(m.vergiNo||"").trim(), p=vn.match(/^(.*?\D)\s*[\/,\-]\s*(\d[\d\s]*)$/);
      if(p){ m.vergiDairesi=p[1].replace(/[\/,\-\s]+$/,"").trim(); m.vergiNo=p[2].replace(/\s/g,""); }
      else if(vn && !/\d/.test(vn)){ m.vergiDairesi=vn; m.vergiNo=""; }
      else m.vergiDairesi="";
    }
    CARI_ALANLAR.forEach(function(a){ if(m[a[0]]==null) m[a[0]]=""; });
  });
  v.kullanicilar=v.kullanicilar||[];
  v.isler.forEach(function(is){
    if(!is.musteriId && is.firma){ is.musteriId=musteriBulYaDaEkle(is.firma).id; }
    if(!is.teslimHedefi && is.siparisTarihi && is.gunSayisi){
      var d=tarihe(is.siparisTarihi); d.setDate(d.getDate()+Number(is.gunSayisi)); is.teslimHedefi=anahtarla(d);
    }
    if(!is.ilkTermin) is.ilkTermin=is.teslimHedefi||"";
    is.teslimatlar=is.teslimatlar||[]; is.gecmis=is.gecmis||[]; is.belgeler=is.belgeler||[];
    /* ek maliyet: boş satırları at, tedarikçi alanını ekle */
    is.ekMaliyetler=(is.ekMaliyetler||[]).filter(function(e){ return e && (String(e.ad||"").trim()||String(e.tutar||"").trim()||String(e.tedarikci||"").trim()); })
      .map(function(e){ return {tedarikci:e.tedarikci||"",ad:e.ad||"",tutar:e.tutar==null?"":e.tutar}; });
    is.paraBirimi=is.paraBirimi||"TL";
    if(!is.makinaPlan) is.makinaPlan = (is.makina && is.makina.id)? [is.makina] : [];
    delete is.makina;
    if(!is.durum || is.durum==="bekliyor"||is.durum==="uretimde"||is.durum==="kalitede"){
      if(is.teslimEdildi){
        is.durum="kapali";
        if(!is.teslimatlar.length) is.teslimatlar.push({id:yeniId("t"),adet:Number(is.adet)||0,tarih:is.teslimTarihi||is.teslimHedefi,kur:1,kim:"Aktarım",zaman:new Date().toISOString()});
      } else is.durum="acik";
    }
    if(is.durum==="teslim") is.durum="kapali";
  });
  v.surum=2;
}
/* 30 günden eski silinmiş kayıtları kalıcı olarak temizler */
function copBosalt(){
  var sinir=Date.now()-COP_GUN*86400000;
  ["isler","musteriler","parcaKartlari","makinalar","stoklar"].forEach(function(t){
    veri[t]=veri[t].filter(function(x){ return !x.silindi || new Date(x.silindi.zaman).getTime()>sinir; });
  });
  kaydet();
}

/* =====================================================================
   YARDIMCILAR
   ===================================================================== */
function yeniId(on){ return (on||"x")+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function ikiHane(n){ return n<10?"0"+n:""+n; }
function anahtarla(d){ return d.getFullYear()+"-"+ikiHane(d.getMonth()+1)+"-"+ikiHane(d.getDate()); }
function bugun(){ return anahtarla(new Date()); }
function tarihe(s){ if(!s) return null; var p=String(s).split("-"); if(p.length!==3) return null; var d=new Date(+p[0],+p[1]-1,+p[2]); return isNaN(d.getTime())?null:d; }
function tarihYaz(s){ var d=tarihe(s); return d? d.getDate()+" "+AYLAR[d.getMonth()]+" "+d.getFullYear() : "—"; }
function kisa(s){ var d=tarihe(s); return d? d.getDate()+" "+AYLAR[d.getMonth()].slice(0,3) : "—"; }
function zamanYaz(iso){ if(!iso) return "—"; var d=new Date(iso); return d.getDate()+" "+AYLAR[d.getMonth()].slice(0,3)+" "+d.getFullYear()+" "+ikiHane(d.getHours())+":"+ikiHane(d.getMinutes()); }
function gunFarki(a,b){ return Math.round((tarihe(b)-tarihe(a))/86400000); }
/* Türkçe sayı: 106.500 = yüz altı bin beş yüz, 3,5 = üç buçuk, 1.250,75 = bin iki yüz elli virgül yetmiş beş */
function sayi(v){
  if(v===""||v==null) return 0;
  if(typeof v==="number") return isNaN(v)?0:v;
  var s=String(v).replace(/\s/g,"").replace(/₺|TL/gi,"");
  if(s.indexOf(",")>=0) s=s.replace(/\./g,"").replace(",",".");
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  var n=Number(s); return isNaN(n)?0:n;
}
function para(n,pb){ var s=(Number(n)||0).toLocaleString("tr-TR",{minimumFractionDigits:0,maximumFractionDigits:2}); return pb&&pb!=="TL"? PARA[pb]+s : s+" ₺"; }
function tl(n){ return para(n,"TL"); }
function yuzde(n){ return "%"+(Number(n)||0).toLocaleString("tr-TR",{maximumFractionDigits:1}); }
function kacir(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function boyutYaz(b){ return !b?"": b<1024? b+" B": b<1048576? Math.round(b/1024)+" KB": (b/1048576).toFixed(1)+" MB"; }
function yonetici(){ return kullanici && kullanici.rol==="admin"; }
function musteriRol(){ return kullanici && kullanici.rol==="musteri"; }
/* kullanıcının görmeye yetkili olduğu işler */
function gorunenIsler(){
  var l=canli(veri.isler);
  if(musteriRol()) l=l.filter(function(i){ return i.musteriId===kullanici.musteriId; });
  return l;
}
function yetkiIsAc(){ if(musteriRol()) return false; return yonetici() || (kullanici && kullanici.yetki && kullanici.yetki.isAc); }
function yetkiKapat(){ if(musteriRol()) return false; return yonetici() || (kullanici && kullanici.yetki && kullanici.yetki.kapat); }
function canli(liste){ return liste.filter(function(x){ return !x.silindi; }); }

function musteri(id){ return veri.musteriler.filter(function(m){ return m.id===id; })[0]; }
function musteriAdi(id){ var m=musteri(id); return m? m.ad : ""; }
function musteriBulYaDaEkle(ad){
  ad=String(ad||"").trim(); if(!ad) return {id:""};
  var m=veri.musteriler.filter(function(x){ return !x.silindi && x.tur!=="tedarikci" && x.ad.toLocaleLowerCase("tr")===ad.toLocaleLowerCase("tr"); })[0];
  if(m) return m;
  m={id:yeniId("m"),tur:"musteri",ad:ad,olusturma:new Date().toISOString()}; CARI_ALANLAR.forEach(function(a){ if(a[0]!=="ad") m[a[0]]=""; });
  m.musteriNo=sonrakiMusteriNo();
  veri.musteriler.push(m); return m;
}

/* ---- kodlama: MQ-1 + müşteri kodu (2 hane) + parça no (3 hane), ör. MQ-101001 ---- */
function sonrakiMusteriNo(){
  var mx=0; veri.musteriler.forEach(function(m){ var n=parseInt(m.musteriNo,10); if(m.tur!=="tedarikci" && n>mx) mx=n; });
  return mx>=99? "" : ikiHane(mx+1);
}
function parcaKodu(mid,haric){
  var m=musteri(mid); if(!m || !/^\d{2}$/.test(String(m.musteriNo||""))) return "";
  var on="MQ-1"+m.musteriNo, mx=0;
  veri.isler.concat(veri.parcaKartlari).forEach(function(x){
    if(haric && x.id===haric) return;
    var r=String(x.maquasKod||"").match(/^MQ-1(\d{2})(\d{3})$/);
    if(r && r[1]===m.musteriNo){ var n=parseInt(r[2],10); if(n>mx) mx=n; }
  });
  return mx>=999? "" : on+("00"+(mx+1)).slice(-3);
}
function kodKullaniliyor(kod,haricId){
  return veri.isler.concat(veri.parcaKartlari).some(function(x){ return x.id!==haricId && x.maquasKod===kod; });
}
/* yöneticide: kodu olmayan müşterilere sırayla kod ver (eski kayıtlar için) */
function musteriKodlariniTamamla(){
  if(!yonetici()) return false;

  veri.musteriler.filter(function(m){ return m.tur!=="tedarikci" && !/^\d{2}$/.test(String(m.musteriNo||"")); })
    .sort(function(a,b){ return String(a.olusturma||"").localeCompare(String(b.olusturma||"")); })
    .forEach(function(m){ var n=sonrakiMusteriNo(); if(n){ m.musteriNo=n; degisti=true; } });
  return degisti;
}

function musteriSecildi(v){
  var f=acikForm; f.musteriId=v;

/* ---- iş hesapları ---- */
function teslimEdilen(is){ return is.teslimatlar.reduce(function(t,x){ return t+sayi(x.adet); },0); }
function kalanAdet(is){ return Math.max(0, sayi(is.adet)-teslimEdilen(is)); }
function birimMaliyet(is){ return sayi(is.malzemeUcreti)+is.ekMaliyetler.reduce(function(t,e){ return t+sayi(e.tutar); },0); }
function kdvOrani(is){ return is.kdvOrani==null||is.kdvOrani===""? 20 : sayi(is.kdvOrani); }
function teslimatKdvli(is,t){ return teslimatTutari(is,t)*(1+kdvOrani(is)/100); }
function teslimatTutari(is,t){ return sayi(t.adet)*sayi(is.satisFiyati)*(is.paraBirimi==="TL"?1:sayi(t.kur)||0); }
function teslimatMaliyeti(is,t){ return sayi(t.adet)*birimMaliyet(is); }
function kalanGun(is){ return is.teslimHedefi? gunFarki(bugun(), is.teslimHedefi) : null; }
function durum(is){
  if(is.durum==="iptal") return "iptal";
  if(is.durum==="kapali") return "kapali";
  var k=kalanGun(is); if(k===null) return "normal";
  return k<0?"gecikmis": k<=3?"yakin":"normal";
}
function gecmisEkle(is,islem){ is.gecmis.push({zaman:new Date().toISOString(),kim:kullanici.ad,islem:islem}); }

/* =====================================================================
   BİLDİRİMLER — uygulama içi (açıkken) + tarayıcı bildirimi (izin varsa)
   ===================================================================== */
function bildirimleriTopla(){
  var liste=[], simdi=new Date(), saatUygun=simdi.getHours()>=10, b=bugun();
  gorunenIsler().forEach(function(is){
    if(is.durum!=="acik"||!is.teslimHedefi) return;
    var k=kalanGun(is);
    if(k===3 && saatUygun) liste.push({id:"t3-"+is.id+"-"+is.teslimHedefi,tur:"termin",is:is,metin:(is.maquasKod||"İş")+" — teslim günü 3 gün sonra ("+tarihYaz(is.teslimHedefi)+")"});
    else if(k>=0 && k<3) liste.push({id:"tk-"+is.id+"-"+b,tur:"termin",is:is,metin:(is.maquasKod||"İş")+" — teslime "+(k===0?"bugün":k+" gün")+" kaldı"});
    else if(k<0) liste.push({id:"tg-"+is.id,tur:"gecikme",is:is,metin:(is.maquasKod||"İş")+" — teslim günü "+Math.abs(k)+" gün geçti"});
  });
  if(yonetici()){
    var bek=(veri.kullanicilar||[]).filter(function(u){ return u.rol==="yok"; });
    if(bek.length) liste.unshift({id:"onay-"+bek.map(function(u){ return u.id; }).join(""),tur:"onay",metin:bek.length+" kişi hesap onayı bekliyor: "+bek.map(function(u){ return u.ad||u.eposta; }).join(", ")});
  }
  var bayram=BAYRAMLAR[b]||BAYRAMLAR[b.slice(5)];
  if(bayram) liste.unshift({id:"b-"+b,tur:"bayram",metin:bayram+". MAQUAS TECHNIC ailesi olarak iyi bayramlar dileriz."});
  return liste;
}
function yeniBildirimSayisi(){ return bildirimleriTopla().filter(function(x){ return !veri.gosterilenBildirim[x.id]; }).length; }
function tarayiciBildirimi(){
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  if(pushDurum==="acik" && !musteriRol()) return;   /* sunucu zaten telefona gönderiyor */
  var degisti=false;
  bildirimleriTopla().forEach(function(x){
    var anahtar="n-"+x.id;
    if(veri.gosterilenBildirim[anahtar]) return;
    if(x.tur==="gecikme") return;   /* gecikmeler şeritte zaten görünüyor */
    try{ new Notification("MAQUAS",{body:x.metin,icon:"/simge-192.png",tag:x.id}); }catch(e){}
    veri.gosterilenBildirim[anahtar]=Date.now(); degisti=true;
  });
  if(degisti) kaydet();
}
function bildirimIzni(){
  if(!("Notification" in window)){ alert("Bu tarayıcı bildirimleri desteklemiyor."); return; }
  if(!pushDestek()){ Notification.requestPermission().then(function(){ tarayiciBildirimi(); ciz(); }); return; }
  pushDurum="bekle"; ciz();
  pushAbone(true).then(function(ok){
    if(!ok && pushDurum!=="hata") pushDurum="";
    ciz();
    if(!ok && Notification.permission==="denied") alert("Bildirim izni verilmedi. Telefonun ayarlarından bu uygulamaya bildirim izni verebilirsin.");
    else if(!ok) alert("Bildirimler açılamadı"+(pushHata?": "+pushHata:"")+". İnternet bağlantını kontrol edip tekrar dene.");
  });
}

/* ---- telefona bildirim (uygulama kapalıyken de): sunucu gönderir ---- */
function bildirimFn(){ return SB_ADRES+"/functions/v1/bildirim"; }
var pushDurum="", pushHata="";
function pushDestek(){ return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window; }
function iosTarayicida(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) && !(navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches)); }
function pushAnahtarCoz(s){
  var b=atob(s.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((s.length+3)%4)), o=new Uint8Array(b.length);
  for(var i=0;i<b.length;i++) o[i]=b.charCodeAt(i);
  return o;
}
/* sor=true: izin ister (yalnız düğmeye basınca). Başarılıysa abonelik bu kullanıcıya kaydedilir. */
function pushAbone(sor){
  if(!pushDestek() || !sb || !kullanici) return Promise.resolve(false);
  var izin = sor? Notification.requestPermission() : Promise.resolve(Notification.permission);
  return Promise.resolve(izin).then(function(p){
    if(p!=="granted") return false;
    var hazir=new Promise(function(ok,red){ navigator.serviceWorker.ready.then(ok); setTimeout(function(){ red(new Error("uygulama henüz hazır değil, sayfayı yenileyip tekrar dene")); },15000); });
    return hazir.then(function(reg){
      return reg.pushManager.getSubscription().then(function(s){
        if(s) return s;
        return fetch(bildirimFn(),{method:"POST",headers:{"Content-Type":"application/json"},body:'{"olay":"anahtar"}'})
          .then(function(r){ return r.json(); })
          .then(function(j){ if(!j || !j.acik) throw new Error("anahtar alınamadı"); return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:pushAnahtarCoz(j.acik)}); });
      });
    }).then(function(s){
      var j=s.toJSON();
      return sb.rpc("push_kaydet",{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_cihaz:navigator.userAgent.slice(0,200)}).then(function(r){
        if(r.error) throw r.error;
        pushDurum="acik"; pushHata=""; return true;
      });
    });
  }).catch(function(e){ pushDurum="hata"; pushHata=hataTurkce(e); return false; });
}
/* çıkışta: bu telefon artık bu hesaba bildirim almasın */
function pushBirak(){
  if(!pushDestek() || !sb) return Promise.resolve();
  return navigator.serviceWorker.getRegistration().then(function(reg){
    return reg && reg.pushManager.getSubscription();
  }).then(function(s){
    if(!s) return;
    return sb.rpc("push_sil",{p_endpoint:s.endpoint});
  }).catch(function(){}).then(function(){ pushDurum=""; });
}
function pushDeneme(){
  sb.auth.getSession().then(function(r){
    var tk=r && r.data && r.data.session && r.data.session.access_token;
    return fetch(bildirimFn(),{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+tk},body:'{"olay":"deneme"}'});
  }).then(function(r){ return r.json(); }).then(function(j){
    alert(j.durum==="gönderildi" && j.adet? "Deneme bildirimi gönderildi. Birkaç saniye içinde telefonuna gelmeli." : j.durum==="biraz bekle"? "Bir dakika içinde yeniden dene." : "Gönderilemedi. Bildirimleri kapatıp yeniden açmayı dene.");
  }).catch(function(e){ alert("Gönderilemedi: "+hataTurkce(e)); });
}
/* bildirime dokununca ilgili işi aç */
function bildirimAdresiAc(h){
  h=String(h||"");
  var m=h.match(/#is=([^&]+)/);

/* =====================================================================
   ÇİZİM — kök
   ===================================================================== */
function ciz(){
  var k=document.getElementById("kok");
  var pd=k.querySelectorAll(".perde"), kayd=[].map.call(pd,function(p){ var m=p.querySelector(".modal"); return [p.scrollTop, m?m.scrollTop:0]; });
  if(!kullanici){ k.innerHTML=girisHTML(); return; }
  cizimBekliyor=false;
  if(!sekmeler().some(function(x){ return x[0]===sekme; })) sekme="takvim";   /* yetkisiz sekme açılmasın */
  var ic = sekme==="takvim"?takvimHTML(): sekme==="liste"?listeHTML(): sekme==="musteriler"?musterilerHTML(): sekme==="rapor"?raporHTML():
    sekme==="stok"?stokHTML(): sekme==="makinalar"?makinalarHTML(): ayarlarHTML();
  k.innerHTML = ustHTML()+uyariHTML()+sekmeHTML()+"<main>"+ic+"</main>"+altCubukHTML()+
    (acikForm?formHTML():"")+(diyalog?diyalogHTML():"")+(bildirimPaneli?bildirimPanelHTML():"");
  /* aynı modal yeniden çizildiyse kaldığı yerden devam etsin */
  [].forEach.call(k.querySelectorAll(".perde"),function(p,i){ if(!kayd[i]) return; p.scrollTop=kayd[i][0]; var m=p.querySelector(".modal"); if(m) m.scrollTop=kayd[i][1]; });
}

function isMakinalari(is){ return (is && is.makinaPlan||[]).filter(function(p){ return p && p.id; }); }

/* makinanın payına düşen adet: girilmişse o, değilse kalan adet makinalara eşit bölünür */
function planAdet(is,i){
  var pl=(is.makinaPlan||[]).filter(function(p){ return p && p.id; }), mk=(is.makinaPlan||[])[i]; if(!mk) return 0;
  if(sayi(mk.adet)) return sayi(mk.adet);
  var acik=pl.filter(function(p){ return !sayi(p.adet); }), kalan=sayi(is.adet);
  pl.forEach(function(p){ kalan-=sayi(p.adet); });
  return acik.length? Math.max(0,Math.round(kalan/acik.length)) : 0;
}
function makinaPayi(is,mid){ var pl=is.makinaPlan||[]; for(var i=0;i<pl.length;i++) if(pl[i]&&pl[i].id===mid) return planAdet(is,i); return 0; }

  if(pb!=="TL"){

/* ---- yazarken: sadece modeli güncelle, ilgili özetleri yerinde yenile ---- */
function yolaYaz(o,k,v){
  if(k.indexOf("ek.")===0){ var p=k.split("."); o.ekMaliyetler[+p[1]][p[2]]=v; return; }
  if(k.indexOf("mk.")===0){ var q=k.split("."); o.makinaPlan[+q[1]][q[2]]=v; return; }
  o[k]=v;
}
function alanYaz(el){
  var k=el.getAttribute("data-k"), v=el.value;
  if(el.getAttribute("data-sayi")) v=v.replace(/[^\d.,]/g,"");   /* sadece rakam, virgül, nokta */
  if(v!==el.value){ var p=el.selectionStart; el.value=v; try{ el.setSelectionRange(p-1,p-1); }catch(e){} }
  yolaYaz(acikForm,k,v);
  var hb=document.getElementById("hesap-blok"); if(hb) hb.innerHTML=hesapBlok(acikForm);
  (acikForm.makinaPlan||[]).forEach(function(mk,i){ var e=document.getElementById("mk-sure-"+i); if(!e||!mk) return; var sn=sayi(mk.parcaSaniye), ad=planAdet(acikForm,i); e.textContent= sn&&ad? "Toplam: "+sureYaz(sn*ad)+" ("+ad.toLocaleString("tr-TR")+" adet)" : ""; });
}
function alanDegis(el){
  yolaYaz(acikForm, el.getAttribute("data-k"), el.value);
  var hb=document.getElementById("hedef-blok"); if(hb) hb.innerHTML=hedefBlok(acikForm);
}
function paraDegis(v){ acikForm.paraBirimi=v; ciz(); }
function ekAdetDegis(v){
  var n=Math.max(0,Math.min(50,parseInt(v,10)||0)), l=acikForm.ekMaliyetler;
  while(l.length<n) l.push({tedarikci:"",ad:"",tutar:""});
  if(l.length>n) l.splice(n);
  ciz();
}
function tedarikciListe(){
  return '<datalist id="tedarikci-liste">'+canli(veri.musteriler).filter(function(m){ return m.tur==="tedarikci"; }).map(function(m){ return '<option value="'+kacir(m.ad)+'"'+(m.grup?' label="'+kacir(m.grup)+'"':'')+'>'; }).join("")+'</datalist>';
}
function tedarikciGruplari(){
  var g={}; canli(veri.musteriler).forEach(function(m){ if(m.tur==="tedarikci" && String(m.grup||"").trim()) g[String(m.grup).trim()]=1; });
  return Object.keys(g).sort(function(a,b){ return a.localeCompare(b,"tr"); });
}
var grupListesi=[];
function tedarikciEkle(i){
  var g = i===-1? String(prompt("Yeni ana başlık adı (örn. Taşlamacılar):")||"").trim() : (grupListesi[i]||"");
  if(i===-1 && !g) return;
  diyalogAc("musteri"); diyalog.tur2="tedarikci"; diyalog.grupOn=g; ciz();
}

function cariHareketler(mid){
  var h=[];
  canli(veri.isler).forEach(function(is){
    if(is.musteriId!==mid) return;
    is.teslimatlar.forEach(function(t,i){
      h.push({tarih:t.tarih,tur:"borc",tutar:teslimatKdvli(is,t),aciklama:(is.maquasKod||"İş")+" · "+(i+1)+". teslimat · "+sayi(t.adet)+" adet · KDV %"+kdvOrani(is)+(is.paraBirimi!=="TL"?" ("+para(sayi(t.adet)*sayi(is.satisFiyati),is.paraBirimi)+", kur "+t.kur+")":"")});
    });
  });
  veri.tahsilatlar.forEach(function(t){ if(t.musteriId===mid) h.push({tarih:t.tarih,tur:"alacak",tutar:sayi(t.tutar),aciklama:"Tahsilat"+(t.aciklama?" · "+t.aciklama:""),id:t.id}); });
  h.sort(function(a,b){ return a.tarih.localeCompare(b.tarih); });
  return h;
}
function cariOzet(mid){
  var h=cariHareketler(mid), b=0, a=0;
  h.forEach(function(x){ if(x.tur==="borc") b+=x.tutar; else a+=x.tutar; });
  return {borc:b,alacak:a,bakiye:b-a};
}

/* =====================================================================
   MAKİNALAR — imalat akışı (iş emrinden) + arıza ve bakım kayıtları
   ===================================================================== */
function makina(id){ return veri.makinalar.filter(function(m){ return m.id===id; })[0]; }
function makinaAdi(id){ var m=makina(id); return m&&!m.silindi? m.ad : ""; }
function makinaIsleri(mid){ return gorunenIsler().filter(function(i){ return !!planBul(i,mid); }); }
function makinaAralik(is,mid){
  var mk=(mid? planBul(is,mid) : isMakinalari(is)[0])||{};
  return {bas:mk.baslangic||is.siparisTarihi||"", bit:mk.bitis||is.teslimHedefi||"", tahmini:!mk.baslangic||!mk.bitis};
}
function sureYaz(sn){
  sn=Math.round(sn); if(!sn) return "";
  var s=Math.floor(sn/3600), d=Math.round((sn%3600)/60);
  return s? s+" sa"+(d?" "+d+" dk":"") : d? d+" dk" : sn+" sn";
}
function makinalarHTML(){
  if(musteriRol()) return "";
  if(secilenMakina && makina(secilenMakina) && !makina(secilenMakina).silindi) return makinaDetayHTML(secilenMakina);
  var l=canli(veri.makinalar).sort(function(a,b){ return a.ad.localeCompare(b.ad,"tr"); });
  return '<div class="baslik-satir"><h2>Makinalar</h2>'+(yonetici()?'<button class="btn" onclick="makinaFormAc()">Yeni makina kartı</button>':'')+'</div>'+
    (l.length? l.map(function(m){

function bakimSahibiMi(){
  if(yonetici()||!diyalog.id) return true;

  var t=diyalog.taslak;

  if(!t.tur){ dHata("Bakım mı arıza mı, seç."); return; }
  if(!t.tarih){ dHata("Tarih gerekli."); return; }
  if(!String(t.not||"").trim()){ dHata("Yapılan işlemi yaz."); return; }
  if(!String(t.yapan||"").trim()){ dHata("İşlemi yapan kişiyi yaz."); return; }
  var x=diyalog.id? veri.bakimlar.filter(function(y){ return y.id===diyalog.id; })[0] : {id:yeniId("b"),makinaId:diyalog.makinaId,kim:kullanici.ad,zaman:new Date().toISOString()};
  x.tur=t.tur; x.tarih=t.tarih; x.not=String(t.not).trim(); x.yapan=String(t.yapan).trim(); x.fotolar=t.fotolar.slice();
  if(!diyalog.id) veri.bakimlar.push(x);

  if(kaydet()){ diyalog=null; ciz(); }

/* fotoğrafı küçültüp JPEG'e çevirir (telefon hafızası sınırlı) */
function fotoKucult(dosya,maks,kalite,cb){
  var o=new FileReader();
  o.onload=function(e){ var img=new Image();
    img.onload=function(){ var s=Math.min(1,maks/Math.max(img.width,img.height)), c=document.createElement("canvas");
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL("image/jpeg",kalite)); };
    img.onerror=function(){ cb(null); }; img.src=e.target.result; };
  o.onerror=function(){ cb(null); };
  o.readAsDataURL(dosya);
}

function ayHesapla(ay){
  var ciro=0, mal=0, musteriKar={}, satirlar=[];
  canli(veri.isler).forEach(function(is){
    is.teslimatlar.forEach(function(t,i){
      if(!t.tarih||t.tarih.slice(0,7)!==ay) return;
      var c=teslimatTutari(is,t), m=teslimatMaliyeti(is,t);
      ciro+=c; mal+=m;
      var ad=musteriAdi(is.musteriId)||"Müşterisiz";
      musteriKar[ad]=(musteriKar[ad]||0)+(c-m);
      satirlar.push({is:is,t:t,no:i+1,ciro:c,mal:m});
    });
  });
  var ekGelir=0, ekGider=0, ekler=[];
  (veri.ekKalemler||[]).forEach(function(e){
    if(!e.tarih||e.tarih.slice(0,7)!==ay) return;
    ekler.push(e); if(e.tur==="gelir") ekGelir+=sayi(e.tutar); else ekGider+=sayi(e.tutar);
  });
  var kar=ciro-mal;
  return {ciro:ciro,mal:mal,kar:kar,oran:ciro?kar/ciro*100:0,musteriKar:musteriKar,satirlar:satirlar,
    ekGelir:ekGelir,ekGider:ekGider,ekler:ekler,net:kar+ekGelir-ekGider};
}
function ayEkle(ay,n){ var d=new Date(+ay.slice(0,4),+ay.slice(5,7)-1+n,1); return d.getFullYear()+"-"+ikiHane(d.getMonth()+1); }
function ayAdi(ay,kisaMi){ var a=AYLAR[+ay.slice(5,7)-1]; return (kisaMi?a.slice(0,3):a)+" "+(kisaMi?ay.slice(2,4):ay.slice(0,4)); }

function pastaSVG(veriler){
  var top=veriler.reduce(function(t,x){ return t+x.deger; },0);
  if(top<=0) return "";
  var r=80, c=90, a=-Math.PI/2, yol="";
  if(veriler.length===1) return '<svg width="180" height="180" viewBox="0 0 180 180"><circle cx="90" cy="90" r="80" fill="'+veriler[0].renk+'"/><circle cx="90" cy="90" r="42" fill="#fff"/></svg>';
  veriler.forEach(function(x){
    var aci=x.deger/top*Math.PI*2, a2=a+aci;
    var x1=c+r*Math.cos(a), y1=c+r*Math.sin(a), x2=c+r*Math.cos(a2), y2=c+r*Math.sin(a2);
    yol+='<path d="M'+c+' '+c+' L'+x1.toFixed(2)+' '+y1.toFixed(2)+' A'+r+' '+r+' 0 '+(aci>Math.PI?1:0)+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+' Z" fill="'+x.renk+'" stroke="#fff" stroke-width="2"/>';
    a=a2;
  });
  return '<svg width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="Kâr dağılımı">'+yol+'<circle cx="90" cy="90" r="42" fill="#fff"/></svg>';
}
function cizgiSVG(aylar){
  var W=560,H=220,sol=64,sag=12,ust=14,alt=30, iw=W-sol-sag, ih=H-ust-alt;
  var degerler=[]; aylar.forEach(function(a){ degerler.push(a.ciro,a.kar); });
  var mx=Math.max.apply(null,degerler.concat([1])), mn=Math.min.apply(null,degerler.concat([0]));
  var aralik=mx-mn||1;
  function X(i){ return sol+(aylar.length===1?iw/2:i*iw/(aylar.length-1)); }
  function Y(v){ return ust+ih-(v-mn)/aralik*ih; }
  var izgara="";
  for(var g=0;g<=4;g++){ var v=mn+aralik*g/4, y=Y(v);
    izgara+='<line x1="'+sol+'" x2="'+(W-sag)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="#e7e5e4"/><text x="'+(sol-6)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="#a8a29e">'+kisaSayi(v)+'</text>'; }
  if(mn<0) izgara+='<line x1="'+sol+'" x2="'+(W-sag)+'" y1="'+Y(0).toFixed(1)+'" y2="'+Y(0).toFixed(1)+'" stroke="#a8a29e" stroke-dasharray="3 3"/>';
  function seri(k,renk){
    var p=aylar.map(function(a,i){ return X(i).toFixed(1)+","+Y(a[k]).toFixed(1); }).join(" ");
    return '<polyline points="'+p+'" fill="none" stroke="'+renk+'" stroke-width="2.5" stroke-linejoin="round"/>'+
      aylar.map(function(a,i){ return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(a[k]).toFixed(1)+'" r="3.5" fill="'+renk+'"><title>'+ayAdi(a.ay)+": "+tl(a[k])+'</title></circle>'; }).join("");
  }
  var etk=aylar.map(function(a,i){ return '<text x="'+X(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="10" fill="#57534e">'+AYLAR[+a.ay.slice(5,7)-1].slice(0,3)+'</text>'; }).join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Aylık ciro ve kâr">'+izgara+seri("ciro","#111111")+seri("kar","#d71920")+etk+'</svg>';
}
function kisaSayi(v){
  var a=Math.abs(v), s=v<0?"-":"";
  function b(x){ return (x<10? x.toFixed(1).replace(".",",").replace(",0","") : Math.round(x)); }
  return a>=1e6? s+b(a/1e6)+" mn" : a>=1e3? s+b(a/1e3)+" bin" : s+Math.round(a);
}
function degisim(simdi,once){ if(!once) return null; return (simdi-once)/Math.abs(once)*100; }

function fotoSec(g){
  var d=g.files&&g.files[0]; if(!d) return;
  var o=new FileReader();
  o.onload=function(e){ var img=new Image(); img.onload=function(){
    var s=Math.min(1,800/Math.max(img.width,img.height)), c=document.createElement("canvas");
    c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    acikForm.foto=c.toDataURL("image/jpeg",.72); ciz(); }; img.src=e.target.result; };
  o.readAsDataURL(d);
}
function belgeSec(g){
  var ds=[].slice.call(g.files||[]); g.value=""; if(!ds.length) return;
  var f=acikForm; f.belgeler=f.belgeler||[];
  ds.forEach(function(d){
    if(d.size>BELGE_SINIR){ alert('"'+d.name+'" 25 MB sınırını aşıyor ('+boyutYaz(d.size)+').'); return; }
    var guvenli=d.name.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ı/g,"i").replace(/[^A-Za-z0-9._-]+/g,"_").slice(-80)||"dosya";
    var yol=yeniId("d")+"/"+guvenli, kayit={ad:d.name,boyut:d.size,yol:yol,yukleniyor:true};
    f.belgeler.push(kayit); ciz();
    sb.storage.from("dosyalar").upload(yol,d,{contentType:d.type||"application/octet-stream",upsert:false}).then(function(r){
      if(r.error){ f.belgeler.splice(f.belgeler.indexOf(kayit),1); alert('"'+d.name+'" yüklenemedi: '+hataTurkce(r.error)); }
      else delete kayit.yukleniyor;

  });
}

      if(r.error) throw r.error;
      sonuc=sonuc.concat(r.data||[]);
      return (r.data||[]).length===adim? parca(bas+adim) : sonuc;
    });
  }
  return parca(0);
}

/* ---------- veriyi indir ---------- */
function verileriYukle(sessiz){
  var istekler=[], yeni=bosVeri();
  function al(tablo,kol,donustur){
    istekler.push(hepsiniCek(tablo).then(function(satirlar){ yeni[kol]=satirlar.map(donustur||function(s){ return s.veri; }); yeni["_"+tablo]=satirlar; }));
  }
  al("isler","isler",function(s){ var v=s.veri; v.id=s.id; v.musteriId=s.musteri_id||v.musteriId||""; return v; });
  if(fiyatGorur()) istekler.push(hepsiniCek("is_finans").then(function(s){ yeni._finans=s; }));
  if(yonetici()){
    al("cariler","musteriler"); al("parca_kartlari","parcaKartlari"); al("tahsilatlar","tahsilatlar"); al("ek_kalemler","ekKalemler");
    istekler.push(hepsiniCek("profiller").then(function(s){ yeni.kullanicilar=s.map(profilNesnesi); }));
  } else if(!musteriRol()){
    istekler.push(hepsiniCek("cari_adlar").then(function(s){ yeni.musteriler=s.map(function(c){ return {id:c.id,ad:c.ad||("Müşteri "+(c.musteri_no||"—")),gizli:!c.ad,tur:c.tur,musteriNo:c.musteri_no||"",silindi:c.silindi?{zaman:new Date().toISOString(),kim:""}:undefined}; }); }));
    istekler.push(hepsiniCek("kisi_adlar").then(function(s){ yeni.kullanicilar=s.map(function(k){ return {id:k.id,ad:k.ad,rol:"calisan"}; }); }));
  }
  if(yetki("stok")) al("stoklar","stoklar");
  if(yetki("makina")){ al("makinalar","makinalar"); al("bakimlar","bakimlar",function(s){ var v=s.veri; v.id=s.id; v._olusturan=s.olusturan; return v; }); }
  if(uretimYazabilir()) al("uretimler","uretimler",function(s){ var v=s.veri; v.id=s.id; v._olusturan=s.olusturan; return v; });
  return Promise.all(istekler).then(function(){
    if(yeni._finans){
      var f={}; yeni._finans.forEach(function(s){ f[s.is_id]=s.veri; });
      yeni.isler.forEach(function(is){ var x=f[is.id]; if(x) FINANS_ALAN.forEach(function(a){ if(x[a]!==undefined) is[a]=x[a]; }); });
    }
    veriyiYerlestir(yeni,true);
    if(senkDurum!=="hata") senkDurum="tamam";
    if(yonetici()){ copBosalt(); if(musteriKodlariniTamamla()) kaydet(); }
    if(sessiz) yenidenCiz(); else girisMod="giris";
  }).catch(function(e){
    if(!navigator.onLine){ senkDurum="cevrimdisi"; ustDurumYenile(); return; }
    senkDurum="hata"; senkHata="Veriler alınamadı: "+(e&&e.message||e); ustDurumYenile();
    if(!sessiz) throw e;
  });
}
function profilNesnesi(p){ return {id:p.id, ad:p.ad||p.kullanici_adi, kullaniciAdi:p.kullanici_adi, eposta:p.eposta, rol:p.rol, musteriId:p.musteri_id, yetki:p.yetki||{}, olusturma:p.olusturma}; }

/* indirilen veriyi uygulamaya yerleştirir; sunucu hali "son hal" olarak kaydedilir */
function veriyiYerlestir(yeni,sunucudan){
  var b=veri && veri.gosterilenBildirim || {};
  ["musteriler","parcaKartlari","tahsilatlar","ekKalemler","stoklar","makinalar","bakimlar","uretimler","isler","kullanicilar"].forEach(function(k){ veri[k]=yeni[k]||[]; });
  veri.gosterilenBildirim=b;
  goc();
  if(sunucudan){
    sonHal={};
    TABLOLAR.forEach(function(t){ sonHal[t.tablo]={}; });
    sonHal.is_finans={};
    TABLOLAR.forEach(function(t){
      veri[t.kol].forEach(function(x){
        if(t.tablo==="isler"){ sonHal.isler[x.id]=JSON.stringify(isSatiri(x)); if(fiyatGorur()) sonHal.is_finans[x.id]=JSON.stringify(finansSatiri(x)); }
        else sonHal[t.tablo][x.id]=JSON.stringify(temizNesne(x));
      });
    });
    onbellekYaz();
  }
}
function temizNesne(x){ var v=JSON.parse(JSON.stringify(x)); delete v._olusturan; return v; }

/* ---------- kaydet: değişen kayıtları sunucuya gönderir ---------- */
var senkSirada=false, senkTekrar=false;
function kaydet(){
  try{ localStorage.setItem("maquas-bildirim-"+(kullanici&&kullanici.id), JSON.stringify(veri.gosterilenBildirim||{})); }catch(e){}
  if(!kullanici || !sb) return true;
  onbellekYaz();
  if(senkSirada){ senkTekrar=true; return true; }
  senkSirada=true; senkDurum="gonderiliyor"; ustDurumYenile();
  senkronEt().then(function(){
    senkSirada=false; senkDurum="tamam"; senkHata=""; ustDurumYenile();
    if(senkTekrar){ senkTekrar=false; kaydet(); }
  }).catch(function(e){
    senkSirada=false; senkTekrar=false;
    if(!navigator.onLine){ senkDurum="cevrimdisi"; ustDurumYenile(); return; }
    senkDurum="hata"; senkHata=(e&&e.message)||String(e); ustDurumYenile();
    var yetkiHatasi=/row-level security|permission|42501/i.test(senkHata);
    alert(yetkiHatasi? "Bu işlem için yetkin yok. Değişiklik geri alındı." : "Kaydedilemedi: "+senkHata+"\nBağlantı gelince tekrar denenecek.");
    if(yetkiHatasi) verileriYukle(true);
  });
  return true;
}
function senkronEt(){
  var isler=[];
  TABLOLAR.forEach(function(t){
    if(!t.yaz()) return;
    var eski=sonHal[t.tablo]||(sonHal[t.tablo]={}), simdi={}, ekle=[], sil=[];
    var finansEski=sonHal.is_finans||(sonHal.is_finans={}), finansEkle=[], finansSimdi={};
    veri[t.kol].forEach(function(x){
      if(!x.id) return;
      if(t.tablo==="isler"){
        var satir=isSatiri(x), j=JSON.stringify(satir); simdi[x.id]=j; if(eski[x.id]!==j) ekle.push(satir);
        if(fiyatGorur()){ var fs=finansSatiri(x), fj=JSON.stringify(fs); finansSimdi[x.id]=fj; if(finansEski[x.id]!==fj) finansEkle.push(fs); }
      } else {
        var v=temizNesne(x), j2=JSON.stringify(v); simdi[x.id]=j2;
        if(eski[x.id]!==j2){ var s={id:x.id, veri:v}; ekle.push(s); }
      }
    });
    Object.keys(eski).forEach(function(id){ if(!(id in simdi)) sil.push(id); });
    if(!ekle.length && !sil.length && !finansEkle.length) return;
    isler.push(Promise.resolve().then(function(){
      return ekle.length? sb.from(t.tablo).upsert(ekle).then(hataKontrol) : null;
    }).then(function(){
      return finansEkle.length? sb.from("is_finans").upsert(finansEkle).then(hataKontrol) : null;
    }).then(function(){
      return sil.length? sb.from(t.tablo).delete().in("id",sil).then(hataKontrol) : null;
    }).then(function(){
      ekle.forEach(function(s){ eski[s.id]=simdi[s.id]; });
      finansEkle.forEach(function(s){ finansEski[s.is_id]=finansSimdi[s.is_id]; });
      sil.forEach(function(id){ delete eski[id]; delete finansEski[id]; });
    }));
  });
  return Promise.all(isler);
}
function hataKontrol(r){ if(r && r.error) throw r.error; return r; }

/* ---------- anlık güncelleme ---------- */
function kanalKur(){
  if(kanal || !sb) return;
  kanal=sb.channel("degisiklikler").on("postgres_changes",{event:"*",schema:"public"},function(p){ uzaktanDegisiklik(p); }).subscribe();
}
function uzaktanDegisiklik(p){
  var tablo=p.table;
  if(tablo==="profiller"){
    if(oturum && ((p.new&&p.new.id===oturum.id)||(p.old&&p.old.id===oturum.id))){ oturumAc(oturum); return; }
    if(yonetici()) verileriYukle(true);
    return;
  }
  if(!kullanici) return;
  if(tablo==="is_finans"){
    var fid=(p.new&&p.new.is_id)||(p.old&&p.old.is_id), is=veri.isler.filter(function(x){ return x.id===fid; })[0];
    if(is && p.new && p.new.veri){ FINANS_ALAN.forEach(function(a){ is[a]=p.new.veri[a]; }); sonHal.is_finans[fid]=JSON.stringify(finansSatiri(is)); }
    yenidenCiz(); return;
  }
  var t=TABLOLAR.filter(function(x){ return x.tablo===tablo; })[0]; if(!t) return;
  var id=(p.new&&p.new.id)||(p.old&&p.old.id); if(!id) return;
  var liste=veri[t.kol], i=-1;
  liste.forEach(function(x,j){ if(x.id===id) i=j; });
  if(p.eventType==="DELETE"){
    if(i>=0) liste.splice(i,1); delete (sonHal[tablo]||{})[id];
  } else if(p.new && p.new.veri){
    var v=p.new.veri; v.id=id;
    if(tablo==="isler"){ v.musteriId=p.new.musteri_id||v.musteriId||""; if(i>=0) FINANS_ALAN.forEach(function(a){ if(liste[i][a]!==undefined && v[a]===undefined) v[a]=liste[i][a]; }); }
    if(tablo==="bakimlar"||tablo==="uretimler") v._olusturan=p.new.olusturan;
    if(i>=0) liste[i]=v; else liste.push(v);
    goc();
    sonHal[tablo]=sonHal[tablo]||{};
    sonHal[tablo][id]= tablo==="isler"? JSON.stringify(isSatiri(v)) : JSON.stringify(temizNesne(v));
  } else { verileriYukle(true); return; }
  onbellekYaz(); yenidenCiz();
}

  if(acikForm || diyalog || yaziyor){ cizimBekliyor=true; ustDurumYenile(); return; }

}

function hataTurkce(e){
  var m=(e&&e.message)||String(e);
  if(/Invalid login/i.test(m)) return "E-posta veya şifre yanlış.";
  if(/Email not confirmed/i.test(m)) return "E-posta adresin henüz onaylanmamış. Gelen kutundaki onay bağlantısına tıkla.";
  if(/already registered|already exists/i.test(m)) return "Bu e-postayla zaten bir hesap var. Giriş yap ya da şifreni yenile.";
  if(/Password should be|weak/i.test(m)) return "Şifre çok kısa ya da zayıf. En az 8 karakter kullan.";
  if(/rate limit|too many/i.test(m)) return "Çok fazla deneme yapıldı. Biraz bekleyip tekrar dene.";
  if(/fetch|network/i.test(m)) return "Sunucuya ulaşılamadı. İnternet bağlantını kontrol et.";
  return m;
}

        (ben?'':'<button class="btn btn-tam" style="background:var(--yuzey);color:var(--kirmizi);border:1px solid var(--kirmizi)" onclick="kisiSil(\''+u.id+'\')">Kullanıcıyı sil</button>')+
      '</div>';
    }).join("") : '<div class="satir" style="color:#a8a29e">Kullanıcı yok.</div>')+'</section>';
}
function kisiRolDegis(id,v){
  var m=document.getElementById("kd-mus-"+id), y=document.getElementById("kd-yet-"+id);
  if(m) m.style.display=v==="musteri"?"block":"none"; if(y) y.style.display=v==="personel"?"flex":"none";
}
function kisiKaydet(id){
  var rol=document.getElementById("kd-rol-"+id).value, ad=document.getElementById("kd-ad-"+id).value.trim(), mid=document.getElementById("kd-mid-"+id).value;
  if(rol==="musteri" && !mid){ alert("Müşteri rolü için firma seç."); return; }
  var y={}; YETKI_ANAHTARLARI.forEach(function(k){ var e=document.getElementById("kd-"+k[0]+"-"+id); y[k[0]]=!!(e&&e.checked); });
  var degisim={ad:ad, rol:rol, musteri_id: rol==="musteri"? mid : null, yetki: rol==="personel"? y : {}};
  if(id===kullanici.id) delete degisim.rol;
  sb.from("profiller").update(degisim).eq("id",id).select().then(function(r){
    if(r.error||!r.data||!r.data.length){ alert("Kaydedilemedi: "+((r.error&&r.error.message)||"yetki yok")); return; }
    var u=veri.kullanicilar.filter(function(x){ return x.id===id; })[0];
    if(u){ var n=profilNesnesi(r.data[0]); Object.keys(n).forEach(function(k){ u[k]=n[k]; }); }
    if(id===kullanici.id){ kullanici.ad=ad; }
    acikKisi=null; ciz();
  });
}
function kisiSil(id){
  var u=(veri.kullanicilar||[]).filter(function(x){ return x.id===id; })[0]; if(!u || id===kullanici.id) return;
  if(!confirm((u.ad||u.eposta||"Bu kullanıcı")+" silinsin mi?\n\nHesabı tamamen silinir ve uygulamaya giremez. Girdiği iş ve cari kayıtları silinmez. Bu işlem geri alınamaz.")) return;
  sb.rpc("kullanici_sil",{p_id:id}).then(function(r){
    if(r.error){ alert("Silinemedi: "+hataTurkce(r.error)); return; }
    veri.kullanicilar=veri.kullanicilar.filter(function(x){ return x.id!==id; });
    acikKisi=null; ciz();
  });
}
function sifreDegistirAc(){ diyalog={tur:"sifreDegistir"}; ciz(); }
function sifreDegistir(){
  var s=document.getElementById("d-yeni").value, s2=document.getElementById("d-yeni2").value;
  if(s.length<8){ dHata("Şifre en az 8 karakter olmalı."); return; }
  if(s!==s2){ dHata("Şifreler aynı değil."); return; }
  sb.auth.updateUser({password:s}).then(function(r){ if(r.error){ dHata(hataTurkce(r.error)); return; } diyalog=null; ciz(); alert("Şifren değiştirildi."); });
}
