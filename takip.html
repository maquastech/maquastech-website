<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MAQUAS Takip">
<link rel="manifest" href="/takip.webmanifest">
<link rel="apple-touch-icon" href="/simge-192.png">
<link rel="icon" href="/simge-192.png">
<title>MAQUAS TECHNIC — İş Takip</title>
<style>
:root{--siyah:#111;--kirmizi:#d71920;--sari:#f0c419;--yesil:#059669;
  --gri1:#f5f5f4;--gri2:#e7e5e4;--gri3:#a8a29e;--gri4:#57534e;}
*{box-sizing:border-box}
body{margin:0;background:var(--gri1);color:var(--siyah);font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.gizli{display:none!important}
label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
input,select,textarea{width:100%;border:1px solid var(--gri2);padding:10px 12px;background:#fff;border-radius:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--siyah);outline-offset:-2px}
input:disabled,select:disabled,textarea:disabled{background:var(--gri1);color:var(--gri4)}
.btn{display:inline-block;background:var(--siyah);color:#fff;padding:12px 18px;font-weight:600;text-align:center}
.btn:hover{background:#000}
.btn-tam{width:100%}
.btn-acik{background:#fff;color:var(--siyah);border:1px solid var(--siyah)}
.btn-acik:hover{background:var(--gri1)}
.btn-yesil{background:var(--yesil)}
.btn-kirmizi{background:#fff;color:var(--kirmizi);border:1px solid var(--kirmizi)}
.btn-kirmizi:hover{background:#fef2f2}
.btn-kucuk{padding:7px 12px;font-size:13px}
.hata{color:var(--kirmizi);font-size:13px;margin:8px 0}
.ipucu{font-size:12px;color:var(--gri3);margin-top:4px}
.bos{background:#fff;padding:36px 18px;text-align:center;color:var(--gri4)}

/* giris */
.giris-sayfa{min-height:100vh;background:var(--siyah);display:flex;align-items:center;justify-content:center;padding:16px}
.giris-kutu{width:100%;max-width:360px}
.marka{font-size:34px;font-weight:800;letter-spacing:-.02em;color:#fff;line-height:1}
.marka-bant{display:flex;height:4px;width:170px;margin:6px 0 4px}
.marka-bant i{flex:1}.marka-bant i:nth-child(1){background:#fff}.marka-bant i:nth-child(2){background:var(--kirmizi)}.marka-bant i:nth-child(3){background:var(--sari)}
.marka-alt{font-size:13px;letter-spacing:.3em;color:var(--gri3)}
.giris-form{background:#fff;padding:24px;margin-top:28px}

/* ust */
.ust{background:var(--siyah);color:#fff;padding-top:env(safe-area-inset-top)}
.sarma{max-width:1120px;margin:0 auto;padding:0 16px}
.ust-ic{display:flex;align-items:center;justify-content:space-between;padding:10px 0;gap:10px}
.ust .marka{font-size:19px}.ust .marka-bant{width:86px;height:3px;margin:4px 0 0}
.ust-sag{display:flex;align-items:center;gap:14px;font-size:14px;color:#d6d3d1}
.ust-sag .cikis{color:var(--gri3);text-decoration:underline}
.zil{position:relative;width:38px;height:38px;color:#fff;font-size:18px}
.zil-sayi{position:absolute;top:2px;right:0;background:var(--kirmizi);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.uyari{padding:9px 0;font-size:14px}.uyari-kirmizi{background:var(--kirmizi);color:#fff}.uyari-sari{background:var(--sari)}
.sekmeler{background:#fff;border-bottom:1px solid var(--gri2);position:sticky;top:0;z-index:20}
.sekmeler .sarma{display:flex;overflow-x:auto}
.sekme{padding:13px 16px;font-size:14px;font-weight:600;color:var(--gri4);border-bottom:2px solid transparent;white-space:nowrap}
.sekme.aktif{color:var(--siyah);border-bottom-color:var(--kirmizi)}
main{max-width:1120px;margin:0 auto;padding:22px 16px 90px}
.kart{background:#fff}
.baslik-satir{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.baslik-satir h2{margin:0;font-size:20px}

/* takvim */
.takvim-duzen{display:grid;gap:20px}
@media(min-width:1000px){.takvim-duzen{grid-template-columns:1fr 360px}}
.takvim-ust{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--gri2)}
.takvim-ust h2{margin:0;font-size:18px}
.ok{width:40px;height:40px;font-size:22px}.ok:hover{background:var(--gri1)}
.gun-bas,.gun-izgara{display:grid;grid-template-columns:repeat(7,1fr)}
.gun-bas{border-bottom:1px solid var(--gri2)}
.gun-bas div{padding:8px 0;text-align:center;font-size:12px;font-weight:600;color:var(--gri3)}
.hucre{position:relative;aspect-ratio:1;border-bottom:1px solid var(--gri1);border-right:1px solid var(--gri1);padding:5px;display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:3px}
.hucre:hover{background:var(--gri1)}
.hucre.secili{outline:2px solid var(--siyah);outline-offset:-2px;background:#fff}
.hucre.bos-h{cursor:default}
.hucre-no{font-size:13px;font-weight:600;align-self:flex-start}
.hucre.bugun .hucre-no{background:var(--siyah);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.hucre.bayram .hucre-no{color:var(--kirmizi)}
.hucre.bugun.bayram .hucre-no{color:#fff;background:var(--kirmizi)}
.isaret{font-size:11px;font-weight:700;padding:2px 5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.isaret.gecikmis{background:var(--kirmizi);color:#fff}
.isaret.yakin{background:var(--sari)}
.isaret.normal{background:var(--gri2);color:var(--gri4)}
.isaret.kapali{background:#d1fae5;color:#065f46}
.isaret.iptal{background:#fff;color:var(--gri3);text-decoration:line-through;border:1px solid var(--gri2)}
.isaret.siparis{background:#fff;color:var(--gri4);border:1px dashed var(--gri3);font-weight:600}
.noktalar{display:flex;flex-direction:column;gap:3px}
.fazla{font-size:10px;color:var(--gri3);line-height:1}
.aciklama{padding:12px 14px;border-top:1px solid var(--gri2);display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--gri4)}
.aciklama span{display:flex;align-items:center;gap:6px}
.ornek{display:inline-block;width:16px;height:12px}
.grup-etiket{font-size:12px;font-weight:700;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.grup-etiket.gri{color:var(--gri3)}
.yan-baslik{font-weight:700;margin:0 0 2px}
.yan-ozet{font-size:14px;color:var(--gri3);margin:0 0 12px}
.bayram-not{background:#fef2f2;border-left:4px solid var(--kirmizi);padding:10px 12px;font-size:14px;margin-bottom:12px}

/* is satiri */
.is-satir{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--gri2);border-left:4px solid var(--gri2);padding:12px;margin-bottom:8px}
.is-satir:hover{background:var(--gri1)}
.is-satir.gecikmis{border-left-color:var(--kirmizi)}
.is-satir.yakin{border-left-color:var(--sari)}
.is-satir.kapali{border-left-color:var(--yesil)}
.is-satir.iptal{opacity:.6}
.is-ust{display:flex;justify-content:space-between;gap:12px}
.is-kod{font-weight:700}
.is-alt{font-size:14px;color:var(--gri4)}
.is-sag{text-align:right;white-space:nowrap}
.is-adet{font-size:12px;color:var(--gri3)}
.is-gun{font-weight:700;font-size:14px}
.is-gun.kirmizi{color:var(--kirmizi)}.is-gun.sari{color:#a16207}.is-gun.yesil{color:var(--yesil)}.is-gun.gri{color:var(--gri3)}
.zaman{margin-top:8px;font-size:13px;color:var(--gri4);display:flex;flex-wrap:wrap;gap:3px 12px}
.zaman b{color:var(--siyah)}
.durum-yazi{margin-top:4px;font-size:13px;font-weight:600}
.durum-yazi.yesil{color:var(--yesil)}.durum-yazi.kirmizi{color:var(--kirmizi)}.durum-yazi.mavi{color:#0369a1}
.fiyat-yazi{margin-top:6px;font-size:12px;color:var(--gri3)}

/* liste */
.arac{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.arac input{flex:1;min-width:200px}
.filtreler{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px}
.filtre{padding:6px 12px;font-size:14px;font-weight:600;border:1px solid var(--gri2);background:#fff;color:var(--gri4);white-space:nowrap}
.filtre.aktif{background:var(--siyah);color:#fff;border-color:var(--siyah)}

/* modal */
.perde{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;overflow-y:auto}
@media(min-width:700px){.perde{align-items:center;padding:16px}}
.modal{background:#fff;width:100%;max-width:680px;max-height:94vh;overflow-y:auto;display:flex;flex-direction:column}
.modal-ust{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--gri2);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.modal-ust h3{margin:0;font-size:17px}
.kapat{width:36px;height:36px;font-size:24px}
.modal-ic{padding:16px;display:flex;flex-direction:column;gap:16px}
.ikili{display:grid;gap:14px}
@media(min-width:640px){.ikili{grid-template-columns:1fr 1fr}}
.bolum{border:1px solid var(--gri2);padding:14px}
.bolum-baslik{font-size:14px;font-weight:700;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bolum.finans{background:var(--gri1)}
.ek-satir{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-bottom:8px}
.hedef-blok{border-left:4px solid var(--siyah);background:var(--gri1);padding:12px 16px}
.hedef-tarih{font-size:20px;font-weight:800}
.hedef-alt{font-size:13px;color:var(--gri4)}
.hesap{font-size:14px;line-height:1.8}
.hesap .kar{font-weight:800}
.hesap .kar.eksi{color:var(--kirmizi)}
.durum-banner{padding:12px 16px;font-weight:700}
.durum-banner.kapali{background:#d1fae5;color:#065f46}
.durum-banner.iptal{background:#fee2e2;color:#991b1b}
.teslimat-satir{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--gri1);font-size:14px}
.teslimat-satir:last-child{border-bottom:0}
.gecmis-satir{font-size:13px;color:var(--gri4);padding:5px 0;border-bottom:1px solid var(--gri1)}
.gecmis-satir b{color:var(--siyah)}
.modal-alt{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--gri2);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.son-butonlar{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:4px}
.foto-alan{border:2px dashed var(--gri2);width:100%;padding:22px;color:var(--gri3)}
.foto-on{position:relative}
.foto-on img{width:100%;max-height:220px;object-fit:contain;background:var(--gri1);display:block}
.foto-kaldir{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.92);padding:5px 12px;font-size:13px;font-weight:600}
.belge-satir{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--gri1)}
.belge-satir a{color:var(--siyah);text-decoration:none;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.belge-boyut{font-size:12px;color:var(--gri3)}
.sil-link{color:var(--kirmizi);font-weight:600;font-size:13px;flex:none}

/* diyalog */
.diyalog-perde{z-index:60}
.diyalog{background:#fff;width:100%;max-width:440px}

/* rapor */
.rapor-ust{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.rapor-ust select{width:auto}
.kutular{display:grid;gap:1px;background:var(--gri2);margin-bottom:18px;grid-template-columns:1fr 1fr}
@media(min-width:900px){.kutular.dort{grid-template-columns:repeat(4,1fr)}}
.kutu{background:#fff;padding:14px 16px}
.kutu-e{font-size:13px;color:var(--gri3);margin-bottom:2px}
.kutu-d{font-size:22px;font-weight:800}
.kutu-d.eksi{color:var(--kirmizi)}
.kutu-alt{font-size:12px;margin-top:2px}
.kutu-alt.art{color:var(--yesil)}.kutu-alt.azl{color:var(--kirmizi)}
.grafikler{display:grid;gap:18px;margin-bottom:18px}
@media(min-width:900px){.grafikler{grid-template-columns:1fr 1.3fr}}
.grafik-kart{background:#fff;padding:16px}
.grafik-kart h3{margin:0 0 4px;font-size:15px}
.grafik-kart p{margin:0 0 12px;font-size:13px;color:var(--gri3)}
.pasta-duzen{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pasta-duzen svg{flex:none}
.efsane{flex:1;min-width:160px;font-size:13px}
.efsane div{display:flex;align-items:center;gap:8px;padding:3px 0}
.efsane i{width:12px;height:12px;flex:none}
.efsane span{flex:1}
.cizgi-efsane{display:flex;gap:16px;font-size:12px;color:var(--gri4);margin-top:6px}
.cizgi-efsane span{display:flex;align-items:center;gap:6px}
.tablo-kart{background:#fff;margin-bottom:18px;overflow-x:auto}
.tablo-baslik{padding:12px 16px;border-bottom:1px solid var(--gri2);font-weight:700;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--gri1);white-space:nowrap}
th{font-size:12px;color:var(--gri3);font-weight:600;background:#fafaf9}
td.sag,th.sag{text-align:right}
tfoot td{font-weight:800;border-top:2px solid var(--gri2)}

/* musteri */
.musteri-satir{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--gri2);padding:14px;margin-bottom:8px}
.musteri-satir:hover{background:var(--gri1)}
.bakiye{font-weight:800;text-align:right}
.bakiye.borc{color:var(--kirmizi)}
.bakiye small{display:block;font-weight:400;font-size:12px;color:var(--gri3)}
.geri{font-size:14px;font-weight:600;color:var(--gri4);margin-bottom:12px;display:inline-block}
.cari-ozet{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--gri2);margin-bottom:16px}
.parca-karti{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--gri2);padding:10px;margin-bottom:8px}
.parca-karti img{width:56px;height:56px;object-fit:cover;background:var(--gri1);flex:none}
.parca-karti .pk-bilgi{flex:1;min-width:0}
.parca-karti .pk-bilgi div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ayarlar */
.ayar-duzen{display:grid;gap:18px}
@media(min-width:900px){.ayar-duzen{grid-template-columns:1fr 1fr}}
.satir{padding:12px 16px;border-bottom:1px solid var(--gri1);display:flex;justify-content:space-between;align-items:center;gap:10px}
.satir:last-child{border-bottom:0}
.form-dikey{display:flex;flex-direction:column;gap:12px;padding:16px}
.kutucuk{display:flex;align-items:center;gap:10px;font-size:14px}
.kutucuk input{width:20px;height:20px;flex:none}

/* bildirim paneli */
.bildirim{padding:12px 16px;border-bottom:1px solid var(--gri1);font-size:14px}
.bildirim.yeni{background:#fffbeb}
.bildirim small{display:block;color:var(--gri3);font-size:12px}

/* alt cubuk (telefon) */
.alt-cubuk{display:none}
@media(max-width:700px){
  body{font-size:16px}
  main{padding:14px 12px 100px}
  .sekmeler{display:none}
  .alt-cubuk{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--gri2);padding-bottom:env(safe-area-inset-bottom)}
  .alt-sekme{flex:1;padding:9px 2px 7px;text-align:center;font-size:11px;font-weight:600;color:var(--gri3);display:flex;flex-direction:column;align-items:center;gap:2px}
  .alt-sekme.aktif{color:var(--siyah)}
  .alt-sekme .im{font-size:19px;line-height:1}
  .alt-sekme.aktif .im{color:var(--kirmizi)}
  .hucre{aspect-ratio:auto;min-height:56px;padding:4px 2px;align-items:center}
  .hucre-no{align-self:center;font-size:14px}
  .noktalar{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:4px}
  .isaret{font-size:0;width:11px;height:11px;border-radius:50%;padding:0}
  .isaret.siparis{border:1.5px dashed var(--gri3)}
  .isaret.iptal{border:1.5px solid var(--gri3)}
  .perde{align-items:stretch}
  .modal{max-width:none;max-height:none;min-height:100vh}
  input,select,textarea{padding:12px;font-size:16px}
  .btn{padding:14px 18px}
  .zaman{flex-direction:column;gap:1px}
  .cari-ozet{grid-template-columns:1fr}
}
</style>
</head>
<body>
<noscript><div style="padding:24px;font-family:Arial,sans-serif"><h2>JavaScript kapalı</h2><p>Bu uygulama için tarayıcıda JavaScript açık olmalı.</p></div></noscript>

<script>
window.onerror=function(m,k,s,su){
  var el=document.getElementById("kok");
  if(el) el.innerHTML='<div style="padding:20px;font-family:Arial,sans-serif"><h2 style="color:#d71920">Uygulama açılamadı</h2><pre style="white-space:pre-wrap;background:#f5f5f4;padding:12px;font-size:13px">'+String(m)+"\nSatır "+s+":"+su+"\n"+navigator.userAgent+'</pre></div>';
  return true;
};
"use strict";

/* =====================================================================
   SABİTLER
   ===================================================================== */
var ANAHTAR="maquas-is-takip";
var AYLAR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
var GUN_BAS=["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
var PARA={TL:"₺",USD:"$",EUR:"€"};
var PASTA_RENK=["#111111","#d71920","#f0c419","#0369a1","#059669","#7c3aed","#ea580c","#64748b"];
var COP_GUN=30;

/* Milli günler sabit tarihli; dini bayramlar Diyanet takvimine göre (1. gün). */
var BAYRAMLAR={
  "01-01":"Yeni yılınız kutlu olsun",
  "04-23":"23 Nisan Ulusal Egemenlik ve Çocuk Bayramı kutlu olsun",
  "05-01":"1 Mayıs Emek ve Dayanışma Günü kutlu olsun",
  "05-19":"19 Mayıs Atatürk'ü Anma, Gençlik ve Spor Bayramı kutlu olsun",
  "07-15":"15 Temmuz Demokrasi ve Millî Birlik Günü",
  "08-30":"30 Ağustos Zafer Bayramı kutlu olsun",
  "10-29":"29 Ekim Cumhuriyet Bayramı kutlu olsun",
  "2026-03-20":"Ramazan Bayramınız mübarek olsun",
  "2026-05-27":"Kurban Bayramınız mübarek olsun",
  "2027-03-09":"Ramazan Bayramınız mübarek olsun",
  "2027-05-16":"Kurban Bayramınız mübarek olsun"
};

/* =====================================================================
   DURUM
   ===================================================================== */
var veri=null, kullanici=null, sekme="takvim";
var secilenGun=null, gosterAy=null, raporAy=null;
var listeArama="", listeFiltre="acik";
var acikForm=null;          /* açık iş emri veya parça kartı */
var diyalog=null;           /* kapat / kısmi teslimat / iptal / tahsilat / müşteri */
var secilenMusteri=null;
var bildirimPaneli=false;

function bosVeri(){
  return {surum:2, kullanicilar:[{id:"u1",ad:"Yönetici",kullaniciAdi:"admin",sifre:"maquas",rol:"admin",yetki:{isAc:true,kapat:true}}],
    musteriler:[], parcaKartlari:[], isler:[], tahsilatlar:[], sayac:0, gosterilenBildirim:{}};
}

/* =====================================================================
   KAYIT / YÜKLEME / GÖÇ
   ===================================================================== */
function yukle(){
  var ham=null;
  try{ ham=localStorage.getItem(ANAHTAR); }catch(e){}
  veri = ham ? JSON.parse(ham) : bosVeri();
  goc();
  copBosalt();
}
function kaydet(){
  try{ localStorage.setItem(ANAHTAR, JSON.stringify(veri)); return true; }
  catch(e){ alert("Kaydedilemedi. Depolama dolmuş olabilir; eski belge ve fotoğrafları silmeyi dene."); return false; }
}
/* eski sürüm kayıtlarını yeni yapıya taşır */
function goc(){
  var v=veri;
  v.musteriler=v.musteriler||[]; v.parcaKartlari=v.parcaKartlari||[];
  v.tahsilatlar=v.tahsilatlar||[]; v.gosterilenBildirim=v.gosterilenBildirim||{};
  v.kullanicilar.forEach(function(k){ if(!k.yetki) k.yetki={isAc:k.rol==="admin",kapat:k.rol==="admin"}; });
  v.isler.forEach(function(is){
    if(!is.musteriId && is.firma){ is.musteriId=musteriBulYaDaEkle(is.firma).id; }
    if(!is.teslimHedefi && is.siparisTarihi && is.gunSayisi){
      var d=tarihe(is.siparisTarihi); d.setDate(d.getDate()+Number(is.gunSayisi)); is.teslimHedefi=anahtarla(d);
    }
    if(!is.ilkTermin) is.ilkTermin=is.teslimHedefi||"";
    is.teslimatlar=is.teslimatlar||[]; is.gecmis=is.gecmis||[]; is.belgeler=is.belgeler||[];
    is.ekMaliyetler=is.ekMaliyetler||[{ad:"",tutar:""},{ad:"",tutar:""},{ad:"",tutar:""}];
    is.paraBirimi=is.paraBirimi||"TL";
    if(!is.durum || is.durum==="bekliyor"||is.durum==="uretimde"||is.durum==="kalitede"){
      if(is.teslimEdildi){
        is.durum="kapali";
        if(!is.teslimatlar.length) is.teslimatlar.push({id:yeniId("t"),adet:Number(is.adet)||0,tarih:is.teslimTarihi||is.teslimHedefi,kur:1,kim:"Aktarım",zaman:new Date().toISOString()});
      } else is.durum="acik";
    }
    if(is.durum==="teslim") is.durum="kapali";
  });
  v.surum=2;
}
/* 30 günden eski silinmiş kayıtları kalıcı olarak temizler */
function copBosalt(){
  var sinir=Date.now()-COP_GUN*86400000;
  ["isler","musteriler","parcaKartlari"].forEach(function(t){
    veri[t]=veri[t].filter(function(x){ return !x.silindi || new Date(x.silindi.zaman).getTime()>sinir; });
  });
  kaydet();
}

/* =====================================================================
   YARDIMCILAR
   ===================================================================== */
function yeniId(on){ return (on||"x")+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function ikiHane(n){ return n<10?"0"+n:""+n; }
function anahtarla(d){ return d.getFullYear()+"-"+ikiHane(d.getMonth()+1)+"-"+ikiHane(d.getDate()); }
function bugun(){ return anahtarla(new Date()); }
function tarihe(s){ if(!s) return null; var p=String(s).split("-"); if(p.length!==3) return null; var d=new Date(+p[0],+p[1]-1,+p[2]); return isNaN(d.getTime())?null:d; }
function tarihYaz(s){ var d=tarihe(s); return d? d.getDate()+" "+AYLAR[d.getMonth()]+" "+d.getFullYear() : "—"; }
function kisa(s){ var d=tarihe(s); return d? d.getDate()+" "+AYLAR[d.getMonth()].slice(0,3) : "—"; }
function zamanYaz(iso){ if(!iso) return "—"; var d=new Date(iso); return d.getDate()+" "+AYLAR[d.getMonth()].slice(0,3)+" "+d.getFullYear()+" "+ikiHane(d.getHours())+":"+ikiHane(d.getMinutes()); }
function gunFarki(a,b){ return Math.round((tarihe(b)-tarihe(a))/86400000); }
function sayi(v){ if(v===""||v==null) return 0; var n=Number(String(v).replace(/\s/g,"").replace(",",".")); return isNaN(n)?0:n; }
function para(n,pb){ var s=(Number(n)||0).toLocaleString("tr-TR",{minimumFractionDigits:0,maximumFractionDigits:2}); return pb&&pb!=="TL"? PARA[pb]+s : s+" ₺"; }
function tl(n){ return para(n,"TL"); }
function yuzde(n){ return "%"+(Number(n)||0).toLocaleString("tr-TR",{maximumFractionDigits:1}); }
function kacir(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function boyutYaz(b){ return !b?"": b<1024? b+" B": b<1048576? Math.round(b/1024)+" KB": (b/1048576).toFixed(1)+" MB"; }
function yonetici(){ return kullanici && kullanici.rol==="admin"; }
function yetkiIsAc(){ return yonetici() || (kullanici && kullanici.yetki && kullanici.yetki.isAc); }
function yetkiKapat(){ return yonetici() || (kullanici && kullanici.yetki && kullanici.yetki.kapat); }
function canli(liste){ return liste.filter(function(x){ return !x.silindi; }); }

function musteri(id){ return veri.musteriler.filter(function(m){ return m.id===id; })[0]; }
function musteriAdi(id){ var m=musteri(id); return m? m.ad : ""; }
function musteriBulYaDaEkle(ad){
  ad=String(ad||"").trim(); if(!ad) return {id:""};
  var m=veri.musteriler.filter(function(x){ return !x.silindi && x.ad.toLocaleLowerCase("tr")===ad.toLocaleLowerCase("tr"); })[0];
  if(m) return m;
  m={id:yeniId("m"),ad:ad,yetkili:"",telefon:"",eposta:"",vergiNo:"",adres:"",olusturma:new Date().toISOString()};
  veri.musteriler.push(m); return m;
}

/* ---- iş hesapları ---- */
function teslimEdilen(is){ return is.teslimatlar.reduce(function(t,x){ return t+sayi(x.adet); },0); }
function kalanAdet(is){ return Math.max(0, sayi(is.adet)-teslimEdilen(is)); }
function birimMaliyet(is){ return sayi(is.malzemeUcreti)+is.ekMaliyetler.reduce(function(t,e){ return t+sayi(e.tutar); },0); }
function teslimatTutari(is,t){ return sayi(t.adet)*sayi(is.satisFiyati)*(is.paraBirimi==="TL"?1:sayi(t.kur)||0); }
function teslimatMaliyeti(is,t){ return sayi(t.adet)*birimMaliyet(is); }
function kalanGun(is){ return is.teslimHedefi? gunFarki(bugun(), is.teslimHedefi) : null; }
function durum(is){
  if(is.durum==="iptal") return "iptal";
  if(is.durum==="kapali") return "kapali";
  var k=kalanGun(is); if(k===null) return "normal";
  return k<0?"gecikmis": k<=3?"yakin":"normal";
}
function gecmisEkle(is,islem){ is.gecmis.push({zaman:new Date().toISOString(),kim:kullanici.ad,islem:islem}); }

/* =====================================================================
   BİLDİRİMLER — uygulama içi (açıkken) + tarayıcı bildirimi (izin varsa)
   ===================================================================== */
function bildirimleriTopla(){
  var liste=[], simdi=new Date(), saatUygun=simdi.getHours()>=10, b=bugun();
  canli(veri.isler).forEach(function(is){
    if(is.durum!=="acik"||!is.teslimHedefi) return;
    var k=kalanGun(is);
    if(k===3 && saatUygun) liste.push({id:"t3-"+is.id+"-"+is.teslimHedefi,tur:"termin",is:is,metin:(is.maquasKod||"İş")+" — teslim günü 3 gün sonra ("+tarihYaz(is.teslimHedefi)+")"});
    else if(k>=0 && k<3) liste.push({id:"tk-"+is.id+"-"+b,tur:"termin",is:is,metin:(is.maquasKod||"İş")+" — teslime "+(k===0?"bugün":k+" gün")+" kaldı"});
    else if(k<0) liste.push({id:"tg-"+is.id,tur:"gecikme",is:is,metin:(is.maquasKod||"İş")+" — teslim günü "+Math.abs(k)+" gün geçti"});
  });
  var bayram=BAYRAMLAR[b]||BAYRAMLAR[b.slice(5)];
  if(bayram) liste.unshift({id:"b-"+b,tur:"bayram",metin:bayram+". MAQUAS TECHNIC ailesi olarak iyi bayramlar dileriz."});
  return liste;
}
function yeniBildirimSayisi(){ return bildirimleriTopla().filter(function(x){ return !veri.gosterilenBildirim[x.id]; }).length; }
function tarayiciBildirimi(){
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  var degisti=false;
  bildirimleriTopla().forEach(function(x){
    var anahtar="n-"+x.id;
    if(veri.gosterilenBildirim[anahtar]) return;
    if(x.tur==="gecikme") return;   /* gecikmeler şeritte zaten görünüyor */
    try{ new Notification("MAQUAS Takip",{body:x.metin,icon:"/simge-192.png",tag:x.id}); }catch(e){}
    veri.gosterilenBildirim[anahtar]=Date.now(); degisti=true;
  });
  if(degisti) kaydet();
}
function bildirimIzni(){
  if(!("Notification" in window)){ alert("Bu tarayıcı bildirimleri desteklemiyor."); return; }
  Notification.requestPermission().then(function(){ tarayiciBildirimi(); ciz(); });
}

function etiket(is){ return yonetici()? (musteriAdi(is.musteriId)||is.maquasKod||"İş") : (is.maquasKod||"İş"); }
function takvimHaritasi(){
  var h={};
  function k(t){ return h[t]||(h[t]={siparis:[],teslim:[]}); }
  canli(veri.isler).forEach(function(is){
    if(is.siparisTarihi) k(is.siparisTarihi).siparis.push(is);
    if(is.teslimHedefi) k(is.teslimHedefi).teslim.push(is);
  });
  return h;
}
function takvimHTML(){
  var h=takvimHaritasi(), y=gosterAy.y, m=gosterAy.m;
  var kay=(new Date(y,m,1).getDay()+6)%7, gs=new Date(y,m+1,0).getDate(), hucre="";

    kt.siparis.forEach(function(is){ if(yer>0){ isr+='<div class="isaret siparis">'+kacir(etiket(is))+'</div>'; yer--; } else fazla++; });
    if(fazla) isr+='<div class="fazla">+'+fazla+'</div>';
    var bay=BAYRAMLAR[ak]||BAYRAMLAR[ak.slice(5)];
    hucre+='<button class="hucre'+(ak===secilenGun?" secili":"")+(ak===bugun()?" bugun":"")+(bay?" bayram":"")+'" onclick="gunSec(\''+ak+'\')"><span class="hucre-no">'+g+'</span>'+(isr?'<div class="noktalar">'+isr+'</div>':'')+'</button>';
  }

  if(sk.siparis.length) yan+='<div class="grup-etiket gri">Sipariş alındı</div>'+sk.siparis.map(isSatirHTML).join("");

/* =====================================================================
   İŞ SATIRI
   ===================================================================== */
function isSatirHTML(is){
  var d=durum(is), k=kalanGun(is), te=teslimEdilen(is), ad=sayi(is.adet);
  var sag="";
  if(d==="kapali") sag='<div class="is-gun yesil">Kapandı</div>';
  else if(d==="iptal") sag='<div class="is-gun gri">İptal</div>';
  else if(k!==null) sag='<div class="is-gun '+(k<0?"kirmizi":k<=3?"sari":"")+'">'+(k<0?Math.abs(k)+" gün geçti":k===0?"Bugün teslim":k+" gün kaldı")+'</div>';
  var alt = yonetici()? (musteriAdi(is.musteriId)||"Müşteri girilmedi") : (is.malzemeCinsi||"");
  var sure = (is.siparisTarihi&&is.teslimHedefi)? gunFarki(is.siparisTarihi,is.teslimHedefi) : null;
  var z='<div class="zaman"><span>Sipariş: <b>'+kisa(is.siparisTarihi)+'</b></span><span>Teslim günü: <b>'+kisa(is.teslimHedefi)+'</b></span>'+(sure!==null?'<span>Süre: <b>'+sure+' gün</b></span>':'')+
    (is.ilkTermin && is.ilkTermin!==is.teslimHedefi?'<span>İlk termin: <b>'+kisa(is.ilkTermin)+'</b></span>':'')+'</div>';
  var dy="";
  if(is.teslimatlar.length){
    var son=is.teslimatlar[is.teslimatlar.length-1];
    if(d==="kapali") dy='<div class="durum-yazi yesil">'+is.teslimatlar.length+' teslimatla kapandı · son teslim '+kisa(son.tarih)+' · '+te+' adet</div>';
    else dy='<div class="durum-yazi mavi">'+is.teslimatlar.length+'. teslimat yapıldı · '+te+' / '+ad+' adet</div>';
  }
  if(d==="iptal") dy+='<div class="durum-yazi kirmizi">İptal edildi'+(is.iptal&&is.iptal.neden?" — "+kacir(is.iptal.neden):"")+'</div>';
  var f = yonetici()&&sayi(is.satisFiyati)? '<div class="fiyat-yazi">'+para(sayi(is.satisFiyati)*ad,is.paraBirimi)+'</div>' : '';
  return '<button class="is-satir '+d+'" onclick="isAc(\''+is.id+'\')"><div class="is-ust"><div><div class="is-kod">'+kacir(is.maquasKod||"Kodsuz")+'</div><div class="is-alt">'+kacir(alt)+'</div></div>'+
    '<div class="is-sag"><div class="is-adet">'+(ad?ad+" adet":"")+'</div>'+sag+'</div></div>'+z+dy+f+'</button>';
}

/* =====================================================================

function listeHTML(){
  var l=canli(veri.isler);
  if(listeFiltre==="acik") l=l.filter(function(i){ return i.durum==="acik"; });
  else if(listeFiltre==="gecikmis") l=l.filter(function(i){ return durum(i)==="gecikmis"; });
  else if(listeFiltre==="kismi") l=l.filter(function(i){ return i.durum==="acik"&&i.teslimatlar.length; });
  else if(listeFiltre==="kapali") l=l.filter(function(i){ return i.durum==="kapali"; });
  else if(listeFiltre==="iptal") l=l.filter(function(i){ return i.durum==="iptal"; });
  var a=listeArama.trim().toLocaleLowerCase("tr");
  if(a) l=l.filter(function(i){
    var al=yonetici()? [i.maquasKod,i.musteriKod,musteriAdi(i.musteriId),i.malzemeCinsi,i.not] : [i.maquasKod,i.malzemeCinsi,i.not];
    return al.filter(Boolean).some(function(x){ return String(x).toLocaleLowerCase("tr").indexOf(a)>=0; });
  });
  l.sort(function(x,y){ return (x.teslimHedefi||"9").localeCompare(y.teslimHedefi||"9"); });
  var f=[["acik","Açık"],["gecikmis","Günü geçmiş"],["kismi","Kısmi teslim"],["kapali","Kapanan"],["iptal","İptal"],["hepsi","Hepsi"]];
  return '<div class="arac"><input id="arama" placeholder="Parça kodu'+(yonetici()?", müşteri":"")+' veya malzeme ara" value="'+kacir(listeArama)+'" oninput="aramaYaz(this.value)">'+
    (yetkiIsAc()?'<button class="btn" onclick="yeniIs()">Yeni iş emri</button>':'')+'</div>'+
    '<div class="filtreler">'+f.map(function(x){ return '<button class="filtre'+(listeFiltre===x[0]?" aktif":"")+'" onclick="filtreSec(\''+x[0]+'\')">'+x[1]+'</button>'; }).join("")+'</div>'+
    '<div id="liste-govde">'+(l.length? l.map(isSatirHTML).join("") : '<div class="bos">Bu filtreye uyan iş yok.</div>')+'</div>';
}

/* =====================================================================
   İŞ EMRİ FORMU — yazarken yeniden çizim YAPMAZ (klavye kapanmasın)
   ===================================================================== */
function girdi(k,etk,deger,o){
  o=o||{};
  var tip=o.sayi?'type="text" inputmode="decimal" autocomplete="off"':(o.tarih?'type="date"':'type="text"');
  var olay=o.tarih? 'onchange="alanDegis(this)"' : 'oninput="alanYaz(this)"';
  return '<div><label for="a-'+k+'">'+etk+'</label><input id="a-'+k+'" data-k="'+k+'" '+(o.sayi?'data-sayi="1"':'')+' '+tip+' value="'+kacir(deger==null?"":deger)+'" '+olay+(o.kapali?" disabled":"")+(o.liste?' list="'+o.liste+'"':'')+(o.yer?' placeholder="'+kacir(o.yer)+'"':'')+'>'+(o.ipucu?'<div class="ipucu">'+o.ipucu+'</div>':'')+'</div>';
}
function hedefBlok(f){
  if(!f.siparisTarihi||!f.teslimHedefi) return '<div class="hedef-blok"><div class="hedef-alt">Sipariş ve teslim tarihini gir.</div></div>';
  var s=gunFarki(f.siparisTarihi,f.teslimHedefi);
  return '<div class="hedef-blok"><div class="hedef-alt">Teslim edilmesi gereken gün</div><div class="hedef-tarih">'+tarihYaz(f.teslimHedefi)+'</div>'+
    '<div class="hedef-alt">'+(s<0?'<span style="color:#d71920">Teslim tarihi sipariş tarihinden önce olamaz</span>':'Sipariş tarihinden <strong>'+s+' gün</strong> sonra')+'</div>'+
    (f.ilkTermin&&f.id&&f.ilkTermin!==f.teslimHedefi?'<div class="hedef-alt">İlk verilen termin: '+tarihYaz(f.ilkTermin)+'</div>':'')+'</div>';
}
function hesapBlok(f){
  var ad=sayi(f.adet), bm=birimMaliyet(f), sf=sayi(f.satisFiyati), pb=f.paraBirimi||"TL";
  if(!ad||!sf) return '<div class="hesap" style="color:#a8a29e">Adet ve satış fiyatı girilince kâr hesaplanır.</div>';
  var satis=ad*sf, mal=ad*bm;
  if(pb!=="TL"){
    return '<div class="hesap">Toplam satış: <b>'+para(satis,pb)+'</b><br>Toplam maliyet: <b>'+tl(mal)+'</b><br>'+
      '<span style="color:#57534e">Kâr, teslimatta girilecek TCMB döviz satış kuruyla TL olarak hesaplanır.</span></div>';
  }
  var kar=satis-mal, oran=satis?kar/satis*100:0;
  return '<div class="hesap">Toplam satış: <b>'+tl(satis)+'</b><br>Toplam maliyet: <b>'+tl(mal)+'</b> <span style="color:#a8a29e">(adet başı '+tl(bm)+')</span><br>'+
    'Kâr: <span class="kar'+(kar<0?" eksi":"")+'">'+tl(kar)+' · '+yuzde(oran)+'</span></div>';
}
function belgelerHTML(f,kapali){
  var l=(f.belgeler||[]).map(function(b,i){
    return '<div class="belge-satir"><a href="'+b.veri+'" download="'+kacir(b.ad)+'">'+kacir(b.ad)+' <span class="belge-boyut">'+boyutYaz(b.boyut)+'</span></a>'+(kapali?'':'<button class="sil-link" onclick="belgeSil('+i+')">Sil</button>')+'</div>';
  }).join("");
  return '<div class="bolum"><div class="bolum-baslik">Data — teknik resim ve belgeler</div>'+(l||'<div class="ipucu" style="margin:0 0 8px">Belge yok.</div>')+
    (kapali?'':'<button class="foto-alan" onclick="document.getElementById(\'belge-girdi\').click()">Belge ekle</button><input id="belge-girdi" type="file" multiple class="gizli" onchange="belgeSec(this)"><div class="ipucu">PDF, DWG, Excel, resim… Dosya başına en fazla 1 MB.</div>')+'</div>';
}
function fotoHTML(f,kapali){
  if(f.foto) return '<div><label>Parça fotoğrafı</label><div class="foto-on"><img src="'+f.foto+'" alt="Parça">'+(kapali?'':'<button class="foto-kaldir" onclick="fotoKaldir()">Kaldır</button>')+'</div></div>';

}

/* ---- yazarken: sadece modeli güncelle, ilgili özetleri yerinde yenile ---- */
function yolaYaz(o,k,v){
  if(k.indexOf("ek.")===0){ var p=k.split("."); o.ekMaliyetler[+p[1]][p[2]]=v; return; }
  o[k]=v;
}
function alanYaz(el){
  var k=el.getAttribute("data-k"), v=el.value;
  if(el.getAttribute("data-sayi")) v=v.replace(/[^\d.,]/g,"");   /* sadece rakam, virgül, nokta */
  if(v!==el.value){ var p=el.selectionStart; el.value=v; try{ el.setSelectionRange(p-1,p-1); }catch(e){} }
  yolaYaz(acikForm,k,v);
  var hb=document.getElementById("hesap-blok"); if(hb) hb.innerHTML=hesapBlok(acikForm);
}
function alanDegis(el){
  yolaYaz(acikForm, el.getAttribute("data-k"), el.value);
  var hb=document.getElementById("hedef-blok"); if(hb) hb.innerHTML=hedefBlok(acikForm);
}
function paraDegis(v){ acikForm.paraBirimi=v; ciz(); }

/* =====================================================================
   MÜŞTERİLER + CARİ
   ===================================================================== */
function cariHareketler(mid){
  var h=[];
  canli(veri.isler).forEach(function(is){
    if(is.musteriId!==mid) return;
    is.teslimatlar.forEach(function(t,i){
      h.push({tarih:t.tarih,tur:"borc",tutar:teslimatTutari(is,t),aciklama:(is.maquasKod||"İş")+" · "+(i+1)+". teslimat · "+sayi(t.adet)+" adet"+(is.paraBirimi!=="TL"?" ("+para(sayi(t.adet)*sayi(is.satisFiyati),is.paraBirimi)+", kur "+t.kur+")":"")});
    });
  });
  veri.tahsilatlar.forEach(function(t){ if(t.musteriId===mid) h.push({tarih:t.tarih,tur:"alacak",tutar:sayi(t.tutar),aciklama:"Tahsilat"+(t.aciklama?" · "+t.aciklama:""),id:t.id}); });
  h.sort(function(a,b){ return a.tarih.localeCompare(b.tarih); });
  return h;
}
function cariOzet(mid){
  var h=cariHareketler(mid), b=0, a=0;
  h.forEach(function(x){ if(x.tur==="borc") b+=x.tutar; else a+=x.tutar; });
  return {borc:b,alacak:a,bakiye:b-a};
}
function musterilerHTML(){
  if(secilenMusteri && musteri(secilenMusteri)) return musteriDetayHTML(secilenMusteri);
  var l=canli(veri.musteriler).slice().sort(function(a,b){ return a.ad.localeCompare(b.ad,"tr"); });
  var top=0; l.forEach(function(m){ top+=cariOzet(m.id).bakiye; });
  return '<div class="baslik-satir"><h2>Müşteriler</h2><button class="btn" onclick="diyalogAc(\'musteri\')">Yeni müşteri</button></div>'+
    (l.length? '<div class="kutular" style="grid-template-columns:1fr"><div class="kutu"><div class="kutu-e">Toplam açık alacak</div><div class="kutu-d">'+tl(top)+'</div></div></div>'+
    l.map(function(m){
      var o=cariOzet(m.id), adet=canli(veri.isler).filter(function(i){ return i.musteriId===m.id; }).length;
      return '<button class="musteri-satir" onclick="musteriAc(\''+m.id+'\')"><div><div style="font-weight:700">'+kacir(m.ad)+'</div><div style="font-size:13px;color:#a8a29e">'+adet+' sipariş'+(m.telefon?" · "+kacir(m.telefon):"")+'</div></div>'+
        '<div class="bakiye'+(o.bakiye>0?" borc":"")+'">'+tl(o.bakiye)+'<small>bakiye</small></div></button>'; }).join("")
    : '<div class="bos">Henüz müşteri yok. İş emri girerken yazdığın müşteri adları buraya otomatik düşer.</div>');
}
function musteriDetayHTML(mid){
  var m=musteri(mid), o=cariOzet(mid), h=cariHareketler(mid), bak=0;
  var isler=canli(veri.isler).filter(function(i){ return i.musteriId===mid; }).sort(function(a,b){ return (b.siparisTarihi||"").localeCompare(a.siparisTarihi||""); });
  var kartlar=canli(veri.parcaKartlari).filter(function(k){ return k.musteriId===mid; });
  var satirlar=h.map(function(x){
    bak += x.tur==="borc"? x.tutar : -x.tutar;
    return '<tr><td>'+kisa(x.tarih)+'</td><td style="white-space:normal">'+kacir(x.aciklama)+'</td><td class="sag">'+(x.tur==="borc"?tl(x.tutar):"")+'</td><td class="sag">'+(x.tur==="alacak"?tl(x.tutar):"")+'</td><td class="sag"><b>'+tl(bak)+'</b></td>'+
      '<td>'+(x.id?'<button class="sil-link" onclick="tahsilatSil(\''+x.id+'\')">Sil</button>':'')+'</td></tr>';
  }).join("");
  return '<button class="geri" onclick="secilenMusteri=null;ciz()">‹ Tüm müşteriler</button>'+

function ayHesapla(ay){
  var ciro=0, mal=0, musteriKar={}, satirlar=[];
  canli(veri.isler).forEach(function(is){
    is.teslimatlar.forEach(function(t,i){
      if(!t.tarih||t.tarih.slice(0,7)!==ay) return;
      var c=teslimatTutari(is,t), m=teslimatMaliyeti(is,t);
      ciro+=c; mal+=m;
      var ad=musteriAdi(is.musteriId)||"Müşterisiz";
      musteriKar[ad]=(musteriKar[ad]||0)+(c-m);
      satirlar.push({is:is,t:t,no:i+1,ciro:c,mal:m});
    });
  });
  return {ciro:ciro,mal:mal,kar:ciro-mal,oran:ciro?(ciro-mal)/ciro*100:0,musteriKar:musteriKar,satirlar:satirlar};
}
function ayEkle(ay,n){ var d=new Date(+ay.slice(0,4),+ay.slice(5,7)-1+n,1); return d.getFullYear()+"-"+ikiHane(d.getMonth()+1); }
function ayAdi(ay,kisaMi){ var a=AYLAR[+ay.slice(5,7)-1]; return (kisaMi?a.slice(0,3):a)+" "+(kisaMi?ay.slice(2,4):ay.slice(0,4)); }

function pastaSVG(veriler){
  var top=veriler.reduce(function(t,x){ return t+x.deger; },0);
  if(top<=0) return "";
  var r=80, c=90, a=-Math.PI/2, yol="";
  if(veriler.length===1) return '<svg width="180" height="180" viewBox="0 0 180 180"><circle cx="90" cy="90" r="80" fill="'+veriler[0].renk+'"/><circle cx="90" cy="90" r="42" fill="#fff"/></svg>';
  veriler.forEach(function(x){
    var aci=x.deger/top*Math.PI*2, a2=a+aci;
    var x1=c+r*Math.cos(a), y1=c+r*Math.sin(a), x2=c+r*Math.cos(a2), y2=c+r*Math.sin(a2);
    yol+='<path d="M'+c+' '+c+' L'+x1.toFixed(2)+' '+y1.toFixed(2)+' A'+r+' '+r+' 0 '+(aci>Math.PI?1:0)+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+' Z" fill="'+x.renk+'" stroke="#fff" stroke-width="2"/>';
    a=a2;
  });
  return '<svg width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="Kâr dağılımı">'+yol+'<circle cx="90" cy="90" r="42" fill="#fff"/></svg>';
}
function cizgiSVG(aylar){
  var W=560,H=220,sol=64,sag=12,ust=14,alt=30, iw=W-sol-sag, ih=H-ust-alt;
  var degerler=[]; aylar.forEach(function(a){ degerler.push(a.ciro,a.kar); });
  var mx=Math.max.apply(null,degerler.concat([1])), mn=Math.min.apply(null,degerler.concat([0]));
  var aralik=mx-mn||1;
  function X(i){ return sol+(aylar.length===1?iw/2:i*iw/(aylar.length-1)); }
  function Y(v){ return ust+ih-(v-mn)/aralik*ih; }
  var izgara="";
  for(var g=0;g<=4;g++){ var v=mn+aralik*g/4, y=Y(v);
    izgara+='<line x1="'+sol+'" x2="'+(W-sag)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="#e7e5e4"/><text x="'+(sol-6)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="#a8a29e">'+kisaSayi(v)+'</text>'; }
  if(mn<0) izgara+='<line x1="'+sol+'" x2="'+(W-sag)+'" y1="'+Y(0).toFixed(1)+'" y2="'+Y(0).toFixed(1)+'" stroke="#a8a29e" stroke-dasharray="3 3"/>';
  function seri(k,renk){
    var p=aylar.map(function(a,i){ return X(i).toFixed(1)+","+Y(a[k]).toFixed(1); }).join(" ");
    return '<polyline points="'+p+'" fill="none" stroke="'+renk+'" stroke-width="2.5" stroke-linejoin="round"/>'+
      aylar.map(function(a,i){ return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(a[k]).toFixed(1)+'" r="3.5" fill="'+renk+'"><title>'+ayAdi(a.ay)+": "+tl(a[k])+'</title></circle>'; }).join("");
  }
  var etk=aylar.map(function(a,i){ return '<text x="'+X(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="10" fill="#57534e">'+AYLAR[+a.ay.slice(5,7)-1].slice(0,3)+'</text>'; }).join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Aylık ciro ve kâr">'+izgara+seri("ciro","#111111")+seri("kar","#d71920")+etk+'</svg>';
}
function kisaSayi(v){
  var a=Math.abs(v), s=v<0?"-":"";
  function b(x){ return (x<10? x.toFixed(1).replace(".",",").replace(",0","") : Math.round(x)); }
  return a>=1e6? s+b(a/1e6)+" mn" : a>=1e3? s+b(a/1e3)+" bin" : s+Math.round(a);
}
function degisim(simdi,once){ if(!once) return null; return (simdi-once)/Math.abs(once)*100; }

  var dolu=seri.filter(function(s){ return s.ciro||s.kar; }).length;
  var ivme='<div class="grafik-kart"><h3>İvme</h3><p>Son 12 ayın cirosu ve kârı</p>'+

      '</tbody><tfoot><tr><td colspan="4">Toplam</td><td class="sag">'+tl(h.ciro)+'</td><td class="sag">'+tl(h.mal)+'</td><td class="sag">'+tl(h.kar)+'</td></tr></tfoot></table>'

      al.map(function(is){ var t=sayi(is.adet)*sayi(is.satisFiyati); if(is.paraBirimi==="TL"&&is.durum!=="iptal") topTL+=t; else if(is.paraBirimi!=="TL") dovizVar=true;

function isAc(id){
  var is=veri.isler.filter(function(x){ return x.id===id; })[0]; if(!is) return;
  acikForm=JSON.parse(JSON.stringify(is)); acikForm.tur="is"; acikForm.musteriAdi=musteriAdi(is.musteriId); ciz();
}
function formKapat(){ acikForm=null; diyalog=null; ciz(); }

function isKaydet(){
  var f=acikForm;
  if(!f.siparisTarihi||!f.teslimHedefi){ alert("Sipariş tarihi ve teslim tarihi gerekli."); return; }
  if(tarihe(f.teslimHedefi)<tarihe(f.siparisTarihi)){ alert("Teslim tarihi sipariş tarihinden önce olamaz."); return; }
  if(!sayi(f.adet)){ alert("Sipariş adedi gerekli."); return; }
  if(yonetici()){ var m=musteriBulYaDaEkle(f.musteriAdi); f.musteriId=m.id||""; }
  var kayit=JSON.parse(JSON.stringify(f)); delete kayit.tur; delete kayit.musteriAdi; delete kayit.kartOlarakKaydet;
  if(!kayit.id){
    veri.sayac++; kayit.id=yeniId("i");
    if(!kayit.maquasKod) kayit.maquasKod="MQ-"+("000"+veri.sayac).slice(-4);
    kayit.ilkTermin=kayit.teslimHedefi;
    kayit.gecmis=[{zaman:new Date().toISOString(),kim:kullanici.ad,islem:"Sipariş oluşturuldu · teslim günü "+tarihYaz(kayit.teslimHedefi)}];
    veri.isler.push(kayit);
    if(f.kartOlarakKaydet) veri.parcaKartlari.push({id:yeniId("k"),musteriId:kayit.musteriId,ad:"",maquasKod:kayit.maquasKod,musteriKod:kayit.musteriKod,malzemeCinsi:kayit.malzemeCinsi,olcu:"",operasyon:"",foto:kayit.foto,belgeler:kayit.belgeler,not:kayit.not});
  } else {
    var eski=veri.isler.filter(function(x){ return x.id===kayit.id; })[0];
    if(eski.teslimHedefi!==kayit.teslimHedefi) kayit.gecmis.push({zaman:new Date().toISOString(),kim:kullanici.ad,islem:"Termin değişti: "+tarihYaz(eski.teslimHedefi)+" → "+tarihYaz(kayit.teslimHedefi)});
    var degisen=[];
    [["adet","adet"],["satisFiyati","satış fiyatı"],["malzemeUcreti","malzeme ücreti"],["musteriId","müşteri"],["maquasKod","parça kodu"]].forEach(function(p){ if(String(eski[p[0]])!==String(kayit[p[0]])) degisen.push(p[1]); });
    if(degisen.length) kayit.gecmis.push({zaman:new Date().toISOString(),kim:kullanici.ad,islem:"Güncellendi: "+degisen.join(", ")});
    veri.isler=veri.isler.map(function(x){ return x.id===kayit.id? kayit : x; });
  }
  if(kaydet()){ acikForm=null; ciz(); }
}

function diyalogAc(tur,id){
  diyalog={tur:tur};
  if(tur==="tahsilat") diyalog.musteriId=id;
  if(tur==="musteri") diyalog.id=id||null;
  ciz();
  setTimeout(function(){ var el=document.querySelector(".diyalog input"); if(el&&tur!=="kapat") el.focus(); },50);
}
function diyalogKapat(){ diyalog=null; ciz(); }
function dHata(m){ var e=document.getElementById("d-hata"); if(e) e.textContent=m; }

function teslimatOnayla(kapat){
  var f=acikForm, adet=sayi(document.getElementById("d-adet").value), tarih=document.getElementById("d-tarih").value;
  var kurEl=document.getElementById("d-kur"), kur=kurEl? sayi(kurEl.value) : 1;
  if(!tarih){ dHata("Teslim tarihi gerekli."); return; }
  if(adet<0){ dHata("Adet eksi olamaz."); return; }
  if(!kapat && !adet){ dHata("Teslim edilen adedi gir."); return; }
  if(kurEl && adet>0 && !kur){ dHata("Dövizli siparişte TCMB döviz satış kuru gerekli."); return; }
  if(adet>kalanAdet(f) && !confirm("Girilen adet ("+adet+") kalan adetten ("+kalanAdet(f)+") fazla. Yine de kaydedilsin mi?")) return;
  var is=veri.isler.filter(function(x){ return x.id===f.id; })[0];
  if(adet>0){
    is.teslimatlar.push({id:yeniId("t"),adet:adet,tarih:tarih,kur:kur,kim:kullanici.ad,zaman:new Date().toISOString()});
    gecmisEkle(is,(is.teslimatlar.length)+". teslimat · "+adet+" adet · "+tarihYaz(tarih)+(kurEl?" · kur "+kur:""));
  }
  if(kapat){ is.durum="kapali"; is.kapanis={kim:kullanici.ad,zaman:new Date().toISOString()}; gecmisEkle(is,"Sipariş kapatıldı · toplam "+teslimEdilen(is)+" adet teslim"); }
  if(kaydet()){ diyalog=null; if(kapat) acikForm=null; else { acikForm=JSON.parse(JSON.stringify(is)); acikForm.tur="is"; acikForm.musteriAdi=musteriAdi(is.musteriId); } ciz(); }
}
function iptalOnayla(){
  var is=veri.isler.filter(function(x){ return x.id===acikForm.id; })[0], n=document.getElementById("d-neden").value.trim();
  is.durum="iptal"; is.iptal={kim:kullanici.ad,zaman:new Date().toISOString(),neden:n};
  gecmisEkle(is,"Sipariş iptal edildi"+(n?" · "+n:""));
  if(kaydet()){ diyalog=null; acikForm=null; ciz(); }
}
function yenidenAc(){
  var is=veri.isler.filter(function(x){ return x.id===acikForm.id; })[0];
  var once=is.durum; is.durum="acik";
  gecmisEkle(is, once==="iptal"?"İptal geri alındı":"Sipariş yeniden açıldı");
  if(kaydet()){ acikForm=JSON.parse(JSON.stringify(is)); acikForm.tur="is"; acikForm.musteriAdi=musteriAdi(is.musteriId); ciz(); }
}
function isSil(){
  if(!confirm("Bu iş emri silinsin mi? "+COP_GUN+" gün boyunca Ayarlar › Silinenler'den geri alınabilir.")) return;
  var is=veri.isler.filter(function(x){ return x.id===acikForm.id; })[0];
  is.silindi={kim:kullanici.ad,zaman:new Date().toISOString()};
  if(kaydet()){ acikForm=null; ciz(); }
}
function geriAl(tur,id){
  var x=veri[tur].filter(function(y){ return y.id===id; })[0]; if(!x) return;
  delete x.silindi; if(x.gecmis) x.gecmis.push({zaman:new Date().toISOString(),kim:kullanici.ad,islem:"Silinenlerden geri alındı"});
  kaydet(); ciz();
}

/* foto & belge */
function fotoKaldir(){ acikForm.foto=""; ciz(); }
function fotoSec(g){
  var d=g.files&&g.files[0]; if(!d) return;
  var o=new FileReader();
  o.onload=function(e){ var img=new Image(); img.onload=function(){
    var s=Math.min(1,800/Math.max(img.width,img.height)), c=document.createElement("canvas");
    c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    acikForm.foto=c.toDataURL("image/jpeg",.72); ciz(); }; img.src=e.target.result; };
  o.readAsDataURL(d);
}
function belgeSec(g){
  var ds=g.files; if(!ds||!ds.length) return; var kalan=ds.length;
  acikForm.belgeler=acikForm.belgeler||[];
  for(var i=0;i<ds.length;i++)(function(d){
    if(d.size>1048576){ alert('"'+d.name+'" 1 MB sınırını aşıyor ('+boyutYaz(d.size)+').'); if(--kalan===0) ciz(); return; }
    var o=new FileReader(); o.onload=function(e){ acikForm.belgeler.push({ad:d.name,boyut:d.size,veri:e.target.result}); if(--kalan===0) ciz(); };
    o.onerror=function(){ if(--kalan===0) ciz(); }; o.readAsDataURL(d);
  })(ds[i]);
}
function belgeSil(i){ acikForm.belgeler.splice(i,1); ciz(); }

/* müşteri */
function musteriAc(id){ secilenMusteri=id; window.scrollTo(0,0); ciz(); }
function musteriKaydet(){
  var al=function(k){ return document.getElementById("d-"+k).value.trim(); };
  var ad=al("ad"); if(!ad){ dHata("Müşteri adı gerekli."); return; }
  var ayni=veri.musteriler.filter(function(m){ return !m.silindi && m.id!==diyalog.id && m.ad.toLocaleLowerCase("tr")===ad.toLocaleLowerCase("tr"); })[0];
  if(ayni){ dHata("Bu adla bir müşteri zaten var."); return; }
  var m = diyalog.id? musteri(diyalog.id) : {id:yeniId("m"),olusturma:new Date().toISOString()};
  ["ad","yetkili","telefon","eposta","vergiNo","adres"].forEach(function(k){ m[k]=al(k); });
  if(!diyalog.id) veri.musteriler.push(m);
  if(kaydet()){ diyalog=null; secilenMusteri=m.id; sekme="musteriler"; ciz(); }
}
function musteriSil(id){
  var n=canli(veri.isler).filter(function(i){ return i.musteriId===id; }).length;
  if(!confirm((n?"Bu müşterinin "+n+" siparişi var; siparişler silinmez. ":"")+"Müşteri silinsin mi? "+COP_GUN+" gün içinde geri alınabilir.")) return;
  musteri(id).silindi={kim:kullanici.ad,zaman:new Date().toISOString()};
  if(kaydet()){ secilenMusteri=null; ciz(); }
}
function tahsilatKaydet(){
  var t=sayi(document.getElementById("d-tutar").value), tr=document.getElementById("d-tarih").value;
  if(!t){ dHata("Tutar gerekli."); return; } if(!tr){ dHata("Tarih gerekli."); return; }
  veri.tahsilatlar.push({id:yeniId("h"),musteriId:diyalog.musteriId,tarih:tr,tutar:t,aciklama:document.getElementById("d-aciklama").value.trim(),kim:kullanici.ad,zaman:new Date().toISOString()});
  if(kaydet()){ diyalog=null; ciz(); }
}
function tahsilatSil(id){
  if(!confirm("Bu tahsilat kaydı silinsin mi?")) return;
  veri.tahsilatlar=veri.tahsilatlar.filter(function(t){ return t.id!==id; }); kaydet(); ciz();
}

/* parça kartı */
function yeniKart(mid){ acikForm={tur:"kart",musteriAdi:musteriAdi(mid),ad:"",maquasKod:"",musteriKod:"",malzemeCinsi:"",olcu:"",operasyon:"",foto:"",belgeler:[],not:""}; ciz(); }
function kartAc(id){ var k=veri.parcaKartlari.filter(function(x){ return x.id===id; })[0]; if(!k) return; acikForm=JSON.parse(JSON.stringify(k)); acikForm.tur="kart"; acikForm.musteriAdi=musteriAdi(k.musteriId); ciz(); }
function kartKaydet(){
  var f=acikForm; if(!f.musteriAdi){ alert("Müşteri adı gerekli."); return; }
  var m=musteriBulYaDaEkle(f.musteriAdi);
  var k=JSON.parse(JSON.stringify(f)); delete k.tur; delete k.musteriAdi; k.musteriId=m.id;
  if(!k.id){ k.id=yeniId("k"); veri.parcaKartlari.push(k); } else veri.parcaKartlari=veri.parcaKartlari.map(function(x){ return x.id===k.id?k:x; });
  if(kaydet()){ acikForm=null; secilenMusteri=m.id; ciz(); }
}
function kartSil(){
  if(!confirm("Parça kartı silinsin mi? "+COP_GUN+" gün içinde geri alınabilir.")) return;
  var k=veri.parcaKartlari.filter(function(x){ return x.id===acikForm.id; })[0];
  k.silindi={kim:kullanici.ad,zaman:new Date().toISOString()}; if(kaydet()){ acikForm=null; ciz(); }
}
function kartdanSiparis(id){
  var k=veri.parcaKartlari.filter(function(x){ return x.id===id; })[0]; if(!k) return;
  acikForm=bosIs(); kartiUygula(k); ciz();
}
function kartdanDoldur(id){
  if(!id) return; var k=veri.parcaKartlari.filter(function(x){ return x.id===id; })[0]; if(!k) return;
  kartiUygula(k); ciz();
}
function kartiUygula(k){
  var f=acikForm;
  f.musteriAdi=musteriAdi(k.musteriId); f.maquasKod=k.maquasKod; f.musteriKod=k.musteriKod; f.malzemeCinsi=k.malzemeCinsi;
  f.foto=k.foto; f.belgeler=JSON.parse(JSON.stringify(k.belgeler||[]));
  f.not=[k.olcu?"Ölçü: "+k.olcu:"",k.operasyon?"Operasyonlar: "+k.operasyon:"",k.not].filter(Boolean).join("\n");
}

/* kullanıcı */
function kisiEkle(){
  var ad=document.getElementById("k-ad").value.trim(), kad=document.getElementById("k-kad").value.trim(), s=document.getElementById("k-sifre").value, rol=document.getElementById("k-rol").value;
  if(!ad||!kad||!s){ alert("Ad, kullanıcı adı ve şifre gerekli."); return; }
  if(veri.kullanicilar.some(function(k){ return k.kullaniciAdi.toLowerCase()===kad.toLowerCase(); })){ alert("Bu kullanıcı adı zaten var."); return; }
  var y = rol==="admin"? {isAc:true,kapat:true} : {isAc:document.getElementById("k-isac").checked,kapat:document.getElementById("k-kapat").checked};
  veri.kullanicilar.push({id:yeniId("u"),ad:ad,kullaniciAdi:kad,sifre:s,rol:rol,yetki:y}); kaydet(); ciz();
}
function kisiSil(id){ if(!confirm("Kullanıcı silinsin mi?")) return; veri.kullanicilar=veri.kullanicilar.filter(function(k){ return k.id!==id; }); kaydet(); ciz(); }
